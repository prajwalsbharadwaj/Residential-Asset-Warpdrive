<template>
    <div class="slds-scope post-sale-app-wrapper">

        <template lwc:if={isLoading}>
            <div class="slds-spinner_container slds-is-fixed">
                <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                    <span class="slds-assistive-text">Loading Workspace...</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </template>

        <template lwc:if={request}>

            <!-- ═════════════════════════════════════════════════════════════════════════ -->
            <!-- 1. COMPACT LIGHTNING HEADER (#0B2345 Dark Navy / Clean Salesforce Style)  -->
            <!-- ═════════════════════════════════════════════════════════════════════════ -->
            <header class="slds-page-header header-dark slds-p-vertical_small slds-p-horizontal_medium slds-m-bottom_small">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    
                    <!-- Left: Title, Request Number & Status -->
                    <div class="slds-media slds-no-space slds-grow">
                        <div class="slds-media__figure">
                            <span class="slds-avatar slds-avatar_medium header-avatar">
                                <lightning-icon icon-name={headerIcon} alternative-text={recordTypeName} size="medium" variant="inverse"></lightning-icon>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <h1 class="header-title font-weight-bold" title={headerTitle}>
                                    {request.Name} · {headerTitle}
                                </h1>
                                <span class={statusBadgeClass}>
                                    ● {request.Status__c}
                                </span>
                            </div>
                            <p class="header-subtitle slds-m-top_xx-small">
                                {unitInfo.projectName} · {unitInfo.towerName} · {unitInfo.name} · Owner: <strong>{customerInfo.accountName}</strong>
                            </p>
                        </div>
                    </div>

                    <!-- Right: Metadata & Contextual Actions -->
                    <div class="slds-no-flex slds-grid slds-grid_vertical-align-center header-meta-box">
                        <div class="header-meta-item slds-m-right_medium">
                            <span class="meta-label">REQUEST DATE:</span>
                            <span class="meta-val">{requestDateFormatted}</span>
                        </div>
                        <div class="header-meta-item slds-m-right_medium">
                            <span class="meta-label">TARGET:</span>
                            <span class="meta-val">{targetDateFormatted}</span>
                        </div>
                        <div class="header-meta-item slds-m-right_medium">
                            <span class="meta-label">OWNER:</span>
                            <span class="meta-val">{request.Owner.Name}</span>
                            <button class="slds-button slds-button_icon slds-button_icon-inverse slds-m-left_xx-small" onclick={openChangeOwnerModal} title="Change Owner">
                                <lightning-icon icon-name="utility:edit" size="xx-small" variant="inverse"></lightning-icon>
                            </button>
                        </div>

                        <!-- Header Standard Actions -->
                        <div class="slds-button-group slds-m-left_small" role="group">
                            <button class="slds-button slds-button_neutral slds-button_x-small btn-header" onclick={handleFollow}>
                                <lightning-icon icon-name="utility:add" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                {followButtonLabel}
                            </button>
                            <button class="slds-button slds-button_neutral slds-button_x-small btn-header" onclick={handlePrintableView}>
                                <lightning-icon icon-name="utility:print" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                Printable View
                            </button>
                        </div>
                    </div>

                </div>
            </header>

            <!-- ═════════════════════════════════════════════════════════════════════════ -->
            <!-- 2. STAGE PATH FOR RENTAL (Preserved standard slds-path)                   -->
            <!-- ═════════════════════════════════════════════════════════════════════════ -->
            <template lwc:if={isRental}>
                <div class="stage-path-container slds-p-horizontal_medium slds-p-vertical_xx-small slds-m-bottom_small slds-card slds-card_boundary">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div class="slds-path slds-grow">
                            <div class="slds-path__track">
                                <div class="slds-path__scroller-container">
                                    <div class="slds-path__scroller">
                                        <div class="slds-path__scroller_inner">
                                            <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal">
                                                <template for:each={stagesList} for:item="stg">
                                                    <li key={stg.name} class={stg.cssClass} role="presentation">
                                                        <a class="slds-path__link" href="javascript:void(0);" role="option" onclick={handleStageClick} data-stage={stg.name}>
                                                            <span class="slds-path__stage">
                                                                <lightning-icon icon-name="utility:check" size="x-small" variant="inverse" class="slds-path__stage-icon"></lightning-icon>
                                                            </span>
                                                            <span class="slds-path__title">{stg.label}</span>
                                                        </a>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right-Docked Stage Primary CTA -->
                        <div class="primary-cta-container slds-no-flex slds-m-left_medium">
                            <button class="slds-button slds-button_brand primary-stage-cta" onclick={handlePrimaryActionClick} disabled={isPrimaryActionDisabled}>
                                {primaryActionLabel}
                            </button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ═════════════════════════════════════════════════════════════════════════ -->
            <!-- 2. RESALE 10-STAGE PROCESS NAVIGATION (Enterprise Salesforce Progress Path)-->
            <!-- ═════════════════════════════════════════════════════════════════════════ -->
            <template lwc:if={isResale}>
                <div class="sf-path-container slds-m-bottom_small">
                    <div class="sf-path-track">
                        <template for:each={resaleProcessStages} for:item="stg">
                            <button 
                                key={stg.name} 
                                class={stg.stepClass} 
                                onclick={handleSelectStageView} 
                                data-stage={stg.name}
                                disabled={stg.isDisabled}
                                title={stg.tooltip}
                                type="button">
                                <template lwc:if={stg.isCompleted}>
                                    <span class="sf-step-check">✓</span>
                                </template>
                                <template lwc:elseif={stg.isCurrent}>
                                    <span class="sf-step-bullet">●</span>
                                </template>
                                <span class="sf-step-title">{stg.stepNumber}. {stg.name}</span>
                            </button>
                        </template>
                    </div>

                    <!-- Previous Stage Read-Only Alert Banner -->
                    <template lwc:if={isViewingPreviousStage}>
                        <div class="viewing-prev-banner slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-horizontal_medium slds-p-vertical_x-small slds-m-top_xx-small">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon icon-name="utility:info_alt" size="x-small" variant="warning" class="slds-m-right_x-small"></lightning-icon>
                                <span class="slds-text-body_small">
                                    You are viewing completed stage: <strong>{effectiveResaleStage}</strong> (Read-Only Archive). Active stage is: <strong>{request.Stage__c}</strong>.
                                </span>
                            </div>
                            <button class="slds-button slds-button_brand slds-button_x-small" onclick={handleReturnToCurrentStage}>
                                Return to Active Stage ({request.Stage__c}) →
                            </button>
                        </div>
                    </template>
                </div>
            </template>

            <!-- ═════════════════════════════════════════════════════════════════════════ -->
            <!-- 3. THREE-COLUMN WORKSPACE                                                 -->
            <!-- ═════════════════════════════════════════════════════════════════════════ -->
            <div class="slds-grid slds-gutters_small main-workspace-grid slds-p-horizontal_medium">

                <!-- ───────────────────────────────────────────────────────────────── -->
                <!-- LEFT COLUMN: CONTEXT (25% / 3-of-12)                              -->
                <!-- ───────────────────────────────────────────────────────────────── -->
                <div class="slds-col slds-size_12-of-12 slds-large-size_3-of-12 left-context-col">

                    <!-- 1. Unit Summary Card -->
                    <article class="slds-card slds-card_boundary slds-m-bottom_small context-card">
                        <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-bottom_xx-small">
                            <span class="slds-text-title_bold text-uppercase section-hdr">UNIT SUMMARY</span>
                            <span class="slds-badge slds-badge_lightest badge-unit-status">{unitInfo.status}</span>
                        </div>
                        <div class="slds-card__body slds-card__body_inner">
                            <div class="unit-highlight-box slds-p-around_x-small slds-m-bottom_x-small">
                                <div class="unit-title">{unitInfo.name}</div>
                                <div class="slds-text-body_small slds-text-color_weak">{unitInfo.projectName} · {unitInfo.towerName}</div>
                            </div>

                            <div class="spec-row slds-grid slds-grid_align-spread">
                                <span class="spec-label">Configuration</span>
                                <span class="spec-val font-weight-bold">{unitInfo.configuration}</span>
                            </div>
                            <template lwc:if={unitInfo.carpetArea}>
                                <div class="spec-row slds-grid slds-grid_align-spread">
                                    <span class="spec-label">Carpet Area</span>
                                    <span class="spec-val">{unitInfo.carpetArea} sq.ft.</span>
                                </div>
                            </template>
                            <template lwc:if={unitInfo.saleableArea}>
                                <div class="spec-row slds-grid slds-grid_align-spread">
                                    <span class="spec-label">Saleable Area</span>
                                    <span class="spec-val">{unitInfo.saleableArea} sq.ft.</span>
                                </div>
                            </template>
                            <div class="spec-row slds-grid slds-grid_align-spread">
                                <span class="spec-label">Possession</span>
                                <span class="spec-val text-success font-weight-bold">{unitInfo.possessionStatus}</span>
                            </div>

                            <!-- Unit Lifecycle Flow -->
                            <div class="unit-lifecycle-tracker slds-m-top_small slds-p-top_x-small slds-border_top">
                                <span class="spec-label slds-m-bottom_xx-small d-block">UNIT LIFECYCLE</span>
                                <div class="lifecycle-steps slds-grid slds-grid_align-spread">
                                    <span class="lstep lstep-done">Booked</span>
                                    <span class="lstep-arrow">→</span>
                                    <span class="lstep lstep-done">Registered</span>
                                    <span class="lstep-arrow">→</span>
                                    <span class="lstep lstep-done">Handed Over</span>
                                    <span class="lstep-arrow">→</span>
                                    <span class="lstep lstep-active">{recordTypeName}</span>
                                </div>
                            </div>
                        </div>
                    </article>

                    <!-- 2. Customer / Owner Card -->
                    <article class="slds-card slds-card_boundary slds-m-bottom_small context-card">
                        <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-bottom_xx-small">
                            <span class="slds-text-title_bold text-uppercase section-hdr">
                                {ownerCardHeader}
                            </span>
                        </div>
                        <div class="slds-card__body slds-card__body_inner">
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                <span class="contact-avatar slds-m-right_x-small">{customerInitials}</span>
                                <div>
                                    <div class="font-weight-bold customer-name">{customerInfo.contactName}</div>
                                    <div class="slds-text-body_small slds-text-color_weak">Primary Owner</div>
                                </div>
                            </div>

                            <template lwc:if={hasCoOwner}>
                                <div class="spec-row slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                    <span class="spec-label">Co-owner</span>
                                    <span class="spec-val">{customerInfo.coOwner}</span>
                                </div>
                            </template>

                            <div class="spec-row slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                <span class="spec-label">Phone</span>
                                <a href={phoneHref} class="spec-val spec-link">{customerInfo.phone}</a>
                            </div>
                            <div class="spec-row slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                                <span class="spec-label">Email</span>
                                <a href={emailHref} class="spec-val spec-link text-truncate" style="max-width: 150px;">{customerInfo.email}</a>
                            </div>

                            <!-- Contextual Contact Actions -->
                            <div class="slds-grid slds-gutters_xx-small slds-m-top_small">
                                <div class="slds-col slds-size_1-of-2">
                                    <button class="slds-button slds-button_neutral slds-button_stretch slds-button_x-small" onclick={handleQuickCallOwner}>
                                        <lightning-icon icon-name="utility:call" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        Call
                                    </button>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <button class="slds-button slds-button_neutral slds-button_stretch slds-button_x-small" onclick={handleQuickEmailOwner}>
                                        <lightning-icon icon-name="utility:email" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        Email
                                    </button>
                                </div>
                            </div>
                        </div>
                    </article>

                    <!-- 3. Source & Channel Card (Rental Only) -->
                    <template lwc:if={isRental}>
                        <article class="slds-card slds-card_boundary context-card">
                            <div class="slds-card__header slds-p-bottom_xx-small">
                                <span class="slds-text-title_bold text-uppercase section-hdr">CHANNEL & BROKERAGE</span>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <div class="spec-row slds-grid slds-grid_align-spread">
                                    <span class="spec-label">Handling Option</span>
                                    <span class="spec-val font-weight-bold">{requestHandlingOption}</span>
                                </div>
                                <template lwc:if={assignedBrokerName}>
                                    <div class="spec-row slds-grid slds-grid_align-spread">
                                        <span class="spec-label">Assigned Partner</span>
                                        <span class="spec-val">{assignedBrokerName}</span>
                                    </div>
                                </template>
                                <div class="notice-pill slds-m-top_x-small slds-p-around_xx-small">
                                    <lightning-icon icon-name="utility:info_alt" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                    <span class="slds-text-body_xx-small">Brokerage terms: <strong>Business Confirmation Required</strong></span>
                                </div>
                            </div>
                        </article>
                    </template>
                </div>

                <!-- ───────────────────────────────────────────────────────────────── -->
                <!-- CENTER COLUMN: CURRENT-STAGE WORKSPACE (50% / 6-of-12)            -->
                <!-- ───────────────────────────────────────────────────────────────── -->
                <div class="slds-col slds-size_12-of-12 slds-large-size_6-of-12 center-stage-col">

                    <!-- ═════════════════════════════════════════════════════════════ -->
                    <!-- RENTAL WORKSPACES (By Active Stage)                           -->
                    <!-- ═════════════════════════════════════════════════════════════ -->
                    <template lwc:if={isRental}>

                        <!-- STAGE 1: VALIDATION -->
                        <template lwc:if={isRentalValidationStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                    <div>
                                        <h2 class="stage-section-title font-weight-bold">STAGE 1: VALIDATION & ELIGIBILITY</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">Source-based verification against Handover, CRM, ERP, and community policies.</p>
                                    </div>
                                    <div class="slds-button-group">
                                        <button class="slds-button slds-button_neutral slds-button_x-small" onclick={handleRequestDocument}>Request Document</button>
                                        <button class="slds-button slds-button_neutral slds-button_x-small" onclick={handleDeclineRequest}>Decline</button>
                                    </div>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    
                                    <!-- Eligibility Table -->
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered eligibility-table slds-m-bottom_medium">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col"><div class="slds-truncate">Check</div></th>
                                                <th scope="col"><div class="slds-truncate">Source</div></th>
                                                <th scope="col"><div class="slds-truncate">Result</div></th>
                                                <th scope="col"><div class="slds-truncate">Status</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={eligibilityChecks} for:item="chk">
                                                <tr key={chk.checkName}>
                                                    <td>
                                                        <div class="slds-grid slds-grid_vertical-align-center">
                                                            <lightning-icon icon-name={chk.iconName} size="x-small" class={chk.iconClass}></lightning-icon>
                                                            <span class="slds-m-left_x-small font-weight-bold">{chk.checkName}</span>
                                                        </div>
                                                    </td>
                                                    <td><span class="source-tag">{chk.source}</span></td>
                                                    <td><span>{chk.result}</span></td>
                                                    <td><span class={chk.statusBadgeClass}>{chk.status}</span></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>

                                    <!-- Owner Preferences Card -->
                                    <div class="sub-card slds-p-around_small slds-border_top slds-border_bottom slds-border_left slds-border_right slds-card_boundary">
                                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                                            <span class="font-weight-bold text-uppercase section-subhdr">OWNER PREFERENCES</span>
                                            <button class="slds-button slds-button_neutral slds-button_x-small" onclick={openEditPreferencesModal}>
                                                <lightning-icon icon-name="utility:edit" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                Edit
                                            </button>
                                        </div>
                                        <div class="slds-grid slds-wrap slds-gutters_small">
                                            <div class="slds-col slds-size_1-of-3 slds-m-bottom_x-small">
                                                <span class="spec-label">Expected Rent</span>
                                                <div class="pref-val font-weight-bold">₹{request.Expected_Rent__c}/mo</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-3 slds-m-bottom_x-small">
                                                <span class="spec-label">Security Deposit</span>
                                                <div class="pref-val font-weight-bold">₹{request.Security_Deposit__c}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-3 slds-m-bottom_x-small">
                                                <span class="spec-label">Available From</span>
                                                <div class="pref-val">{availableFromFormatted}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-3">
                                                <span class="spec-label">Furnishing</span>
                                                <div class="pref-val">{request.Furnishing__c}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-3">
                                                <span class="spec-label">Tenant Preference</span>
                                                <div class="pref-val">{request.Tenant_Preference__c}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-3">
                                                <span class="spec-label">Pet Preference</span>
                                                <div class="pref-val">{request.Pet_Preference__c}</div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </article>
                        </template>

                        <!-- STAGE 2: LISTING -->
                        <template lwc:if={isRentalListingStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                    <div>
                                        <h2 class="stage-section-title font-weight-bold">STAGE 2: LISTING & PROSPECTS</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">Managing inquiries, visit schedules, offers, and owner approvals.</p>
                                    </div>
                                    <div>
                                        <button class="slds-button slds-button_neutral slds-button_x-small" onclick={openAddProspectModal}>
                                            ＋ Add Prospect
                                        </button>
                                    </div>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    
                                    <!-- Listing Overview Metrics -->
                                    <div class="slds-grid slds-gutters_small slds-m-bottom_medium">
                                        <div class="slds-col slds-size_1-of-4">
                                            <div class="metric-box slds-p-around_x-small text-center">
                                                <span class="metric-num">{prospectsEnquiryCount}</span>
                                                <span class="metric-lbl">Enquiries</span>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-4">
                                            <div class="metric-box slds-p-around_x-small text-center">
                                                <span class="metric-num">{prospectsVisitCount}</span>
                                                <span class="metric-lbl">Visits</span>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-4">
                                            <div class="metric-box slds-p-around_x-small text-center">
                                                <span class="metric-num">{prospectsOfferCount}</span>
                                                <span class="metric-lbl">Offers</span>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-4">
                                            <div class="metric-box slds-p-around_x-small text-center">
                                                <span class="metric-num text-success">{request.Listing_Status__c}</span>
                                                <span class="metric-lbl">Listing Status</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Prospects Table -->
                                    <div class="prospects-table-box">
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                            <thead>
                                                <tr class="slds-line-height_reset">
                                                    <th>Prospect</th>
                                                    <th>Stage</th>
                                                    <th>Offered Rent</th>
                                                    <th>Move-in</th>
                                                    <th>Offer Status</th>
                                                    <th class="text-right">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={prospects} for:item="p">
                                                    <tr key={p.Id}>
                                                        <td>
                                                            <div class="font-weight-bold">{p.Prospect_Name__c}</div>
                                                            <div class="slds-text-body_xx-small slds-text-color_weak">{p.Phone__c} · {p.Tenant_Type__c}</div>
                                                        </td>
                                                        <td><span class="badge-stage">{p.Stage__c}</span></td>
                                                        <td><strong>₹{p.Offered_Rent__c}</strong></td>
                                                        <td>{p.Proposed_Move_In_Date__c}</td>
                                                        <td><span class="badge-offer-status">{p.Offer_Status__c}</span></td>
                                                        <td class="text-right">
                                                            <button class="slds-button slds-button_neutral slds-button_xx-small" onclick={openReviewOfferModal} data-id={p.Id}>
                                                                View Offer
                                                            </button>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>

                                </div>
                            </article>
                        </template>

                        <!-- STAGE 3: TENANT & LEASE -->
                        <template lwc:if={isRentalTenantLeaseStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                    <div>
                                        <h2 class="stage-section-title font-weight-bold">STAGE 3: TENANT & LEASE TERMS</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">Selected tenant agreement configuration and compliance document verification.</p>
                                    </div>
                                    <div>
                                        <button class="slds-button slds-button_neutral slds-button_x-small" onclick={openEditLeaseTermsModal}>
                                            Edit Lease Terms
                                        </button>
                                    </div>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    
                                    <!-- Selected Tenant Summary -->
                                    <div class="tenant-hero-card slds-p-around_small slds-m-bottom_medium slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <span class="tenant-avatar slds-m-right_small">TN</span>
                                            <div>
                                                <div class="font-weight-bold tenant-hero-name">{request.Selected_Tenant_Name__c}</div>
                                                <div class="slds-text-body_small slds-text-color_weak">
                                                    {request.Selected_Tenant_Phone__c} · {request.Selected_Tenant_Email__c}
                                                </div>
                                            </div>
                                        </div>
                                        <div class="badge-approved-owner">
                                            ✓ Owner Approved
                                        </div>
                                    </div>

                                    <!-- Lease Terms Grid -->
                                    <div class="sub-card slds-p-around_small slds-m-bottom_medium slds-card_boundary">
                                        <span class="font-weight-bold text-uppercase section-subhdr slds-m-bottom_x-small d-block">COMMERCIAL LEASE TERMS</span>
                                        <div class="slds-grid slds-wrap slds-gutters_small">
                                            <div class="slds-col slds-size_1-of-4 slds-m-bottom_x-small">
                                                <span class="spec-label">Monthly Rent</span>
                                                <div class="pref-val font-weight-bold text-success">₹{request.Monthly_Rent__c}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-4 slds-m-bottom_x-small">
                                                <span class="spec-label">Security Deposit</span>
                                                <div class="pref-val font-weight-bold">₹{request.Deposit_Amount__c}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-4 slds-m-bottom_x-small">
                                                <span class="spec-label">Lease Period</span>
                                                <div class="pref-val">{leasePeriodFormatted}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-4 slds-m-bottom_x-small">
                                                <span class="spec-label">Lock-in Period</span>
                                                <div class="pref-val">{request.Lock_In_Period_Months__c} Months</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-4">
                                                <span class="spec-label">Annual Escalation</span>
                                                <div class="pref-val">{request.Escalation_Percent__c}%</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-4">
                                                <span class="spec-label">Notice Period</span>
                                                <div class="pref-val">{request.Notice_Period_Days__c} Days</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-4">
                                                <span class="spec-label">Maintenance</span>
                                                <div class="pref-val">{request.Maintenance_Responsibility__c}</div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Mandatory Lease Documents -->
                                    <div class="sub-card slds-p-around_small slds-card_boundary">
                                        <span class="font-weight-bold text-uppercase section-subhdr slds-m-bottom_x-small d-block">MANDATORY LEASE DOCUMENTS</span>
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                            <thead>
                                                <tr>
                                                    <th>Document</th>
                                                    <th>Requirement</th>
                                                    <th>Status</th>
                                                    <th class="text-right">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={documents} for:item="d">
                                                    <tr key={d.Id}>
                                                        <td><span class="font-weight-bold">{d.Document_Type__c}</span></td>
                                                        <td><span class="badge-req">{d.Is_Required__c}</span></td>
                                                        <td><span class={d.statusClass}>{d.Status__c}</span></td>
                                                        <td class="text-right">
                                                            <button class="slds-button slds-button_neutral slds-button_xx-small" onclick={handleVerifyDocument} data-id={d.Id}>
                                                                Verify
                                                            </button>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>

                                </div>
                            </article>
                        </template>

                        <!-- STAGE 4: ACTIVE LEASE -->
                        <template lwc:if={isRentalActiveLeaseStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                    <div>
                                        <h2 class="stage-section-title font-weight-bold">STAGE 4: ACTIVE LEASE OPERATIONAL DASHBOARD</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">Ongoing tenancy performance, service tracking, and renewal readiness.</p>
                                    </div>
                                    <div>
                                        <button class="slds-button slds-button_neutral slds-button_x-small" onclick={handleLogOwnerCheckinCall}>
                                            Log Owner Check-in
                                        </button>
                                    </div>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    
                                    <!-- Operational Indicators -->
                                    <div class="slds-grid slds-gutters_small slds-m-bottom_medium">
                                        <div class="slds-col slds-size_1-of-4">
                                            <div class="metric-box slds-p-around_small text-center">
                                                <span class="metric-num text-success">318</span>
                                                <span class="metric-lbl">Days Remaining</span>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-4">
                                            <div class="metric-box slds-p-around_small text-center">
                                                <span class="metric-num">₹{request.Monthly_Rent__c}</span>
                                                <span class="metric-lbl">Monthly Rent</span>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-4">
                                            <div class="metric-box slds-p-around_small text-center">
                                                <span class="metric-num">{request.Notice_Period_Days__c}d</span>
                                                <span class="metric-lbl">Notice Period</span>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-4">
                                            <div class="metric-box slds-p-around_small text-center">
                                                <span class="metric-num text-warning">60d</span>
                                                <span class="metric-lbl">Renewal Alert</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Tenancy History List (Requirement 28 & 30) -->
                                    <div class="sub-card slds-p-around_small slds-card_boundary slds-m-bottom_small">
                                        <span class="font-weight-bold text-uppercase section-subhdr slds-m-bottom_x-small d-block">TENANCY HISTORY</span>
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                            <thead>
                                                <tr>
                                                    <th>Tenancy</th>
                                                    <th>Tenant</th>
                                                    <th>Term Dates</th>
                                                    <th>Rent</th>
                                                    <th>Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={tenancyHistories} for:item="th">
                                                    <tr key={th.Id}>
                                                        <td><span class="font-weight-bold">{th.Tenancy_Number__c}</span></td>
                                                        <td>{th.Tenant_Name__c}</td>
                                                        <td>{th.Start_Date__c} — {th.End_Date__c}</td>
                                                        <td>₹{th.Monthly_Rent__c}</td>
                                                        <td><span class="badge-active-lease">{th.Status__c}</span></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>

                                </div>
                            </article>
                        </template>

                        <!-- STAGE 5: RENEWAL -->
                        <template lwc:if={isRentalRenewalStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-p-around_small slds-border_bottom">
                                    <h2 class="stage-section-title font-weight-bold">STAGE 5: TENANCY RENEWAL DECISION</h2>
                                    <p class="slds-text-body_small slds-text-color_weak">Tenancy approaching expiration. Capture owner decision to renew, re-rent, or stop renting.</p>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    
                                    <div class="renewal-decision-box slds-p-around_medium slds-m-bottom_medium text-center">
                                        <h3 class="font-weight-bold slds-m-bottom_xx-small">Tenancy expires in 45 days</h3>
                                        <p class="slds-text-color_weak slds-m-bottom_medium">Owner confirmation required. Select one of the three verified outcomes:</p>

                                        <div class="slds-grid slds-gutters_small">
                                            <div class="slds-col slds-size_1-of-3">
                                                <div class="decision-card slds-p-around_small" onclick={handleSelectRenewCurrent}>
                                                    <div class="decision-icon">🔄</div>
                                                    <div class="font-weight-bold slds-m-top_xx-small">Renew Current Tenant</div>
                                                    <p class="slds-text-body_xx-small slds-text-color_weak">Extend existing tenancy with revised commercial terms.</p>
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-3">
                                                <div class="decision-card slds-p-around_small" onclick={handleSelectReRentNew}>
                                                    <div class="decision-icon">📋</div>
                                                    <div class="font-weight-bold slds-m-top_xx-small">Re-rent to New Tenant</div>
                                                    <p class="slds-text-body_xx-small slds-text-color_weak">Archive Tenancy 1, initialize Tenancy 2, return to Listing.</p>
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-3">
                                                <div class="decision-card slds-p-around_small" onclick={handleSelectStopRenting}>
                                                    <div class="decision-icon">🛑</div>
                                                    <div class="font-weight-bold slds-m-top_xx-small">Stop Renting</div>
                                                    <p class="slds-text-body_xx-small slds-text-color_weak">Complete tenancy, transition unit to Owner Occupied.</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </article>
                        </template>

                    </template>

                    <!-- ═════════════════════════════════════════════════════════════ -->
                    <!-- RESALE WORKSPACES (By Active Stage)                           -->
                    <!-- ═════════════════════════════════════════════════════════════ -->
                    <template lwc:if={isResale}>

                        <!-- STAGE 1: LEAD ALLOCATION -->
                        <template lwc:if={isResaleLeadAllocationStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-p-around_small slds-border_bottom">
                                    <h2 class="stage-section-title font-weight-bold">STAGE 1: LEAD ALLOCATION & PROPERTY CONTEXT</h2>
                                    <p class="slds-text-body_small slds-text-color_weak">Carried forward unit and financial information from Booking & Handover. Assign internal Resale Advisor and Channel Partners.</p>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    
                                    <!-- Carried Forward Property & Financial Information -->
                                    <div class="sub-card slds-p-around_medium slds-card_boundary slds-m-bottom_medium bg-light">
                                        <span class="font-weight-bold text-uppercase section-subhdr slds-m-bottom_x-small d-block">
                                            CARRIED FORWARD PROPERTY & TRANSACTION RECORD
                                        </span>
                                        <div class="slds-grid slds-wrap slds-gutters_small">
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                                                <span class="spec-label">Unit</span>
                                                <div class="pref-val font-weight-bold">{unitInfo.name}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                                                <span class="spec-label">Project & Tower</span>
                                                <div class="pref-val font-weight-bold">{unitInfo.projectName} · {unitInfo.towerName}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                                                <span class="spec-label">Current Owner</span>
                                                <div class="pref-val font-weight-bold">{customerInfo.contactName}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                                                <span class="spec-label">Original Sale / Booking Value</span>
                                                <div class="pref-val font-weight-bold text-brand">{originalSaleValueFormatted}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                                                <span class="spec-label">Registration Date</span>
                                                <div class="pref-val font-weight-bold">{registrationDateFormatted}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                                                <span class="spec-label">Handover Date</span>
                                                <div class="pref-val font-weight-bold">{handoverDateFormatted}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                                                <span class="spec-label">Assigned Resale Advisor</span>
                                                <div class="pref-val font-weight-bold">{assignedAgentName}</div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Assigned Partners Display (multi-partner) -->
                                    <div class="sub-card slds-p-around_small slds-card_boundary slds-m-bottom_medium">
                                        <div class="slds-m-bottom_xx-small">
                                            <span class="font-weight-bold text-uppercase section-subhdr">ASSIGNED CHANNEL / BROKER PARTNERS</span>
                                        </div>
                                        <template lwc:if={hasAssignedPartners}>
                                            <div class="slds-grid slds-wrap slds-gutters_xx-small">
                                                <template for:each={assignedPartners} for:item="p">
                                                    <div key={p.id} class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_xx-small">
                                                        <div class="partner-pill slds-box slds-box_x-small slds-theme_shade slds-grid slds-grid_align-spread">
                                                            <span class="font-weight-bold">{p.name}</span>
                                                            <span class="slds-badge slds-badge_lightest">{p.role}</span>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div class="slds-text-body_small slds-text-color_weak">No external partners assigned yet. Internal Resale Advisor handles sourcing directly.</div>
                                        </template>
                                    </div>

                                    <div class="slds-text-align_center slds-m-top_medium">
                                        <button class="slds-button slds-button_brand" onclick={openAssignResaleModal}>
                                            Assign Advisor & Move to Property Listing & Buyer Sourcing →
                                        </button>
                                    </div>
                                </div>
                            </article>
                        </template>

                        <!-- STAGE 2: PROPERTY LISTING & BUYER SOURCING -->
                        <template lwc:if={isResaleListingSourcingStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-p-around_small slds-border_bottom">
                                    <h2 class="stage-section-title font-weight-bold">STAGE 2: PROPERTY LISTING & BUYER SOURCING</h2>
                                    <p class="slds-text-body_small slds-text-color_weak">Official property asking terms and registered prospective buyers pipeline.</p>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    
                                    <!-- 1. Official Property Listing Section -->
                                    <div class="sub-card slds-p-around_small slds-card_boundary slds-m-bottom_medium listing-card-highlight">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                                            <span class="font-weight-bold text-uppercase section-subhdr">OFFICIAL PROPERTY LISTING</span>
                                            <span class={listingStatusBadgeClass}>● {listingStatus}</span>
                                        </div>
                                        <div class="slds-grid slds-wrap slds-gutters_small">
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_small">
                                                <span class="spec-label">Unit & Layout</span>
                                                <div class="pref-val font-weight-bold">{unitInfo.name} · {unitInfo.configuration}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_small">
                                                <span class="spec-label">Carpet Area</span>
                                                <div class="pref-val font-weight-bold text-brand">{unitCarpetAreaFormatted}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_small">
                                                <span class="spec-label">Asking Resale Price</span>
                                                <div class="pref-val font-weight-bold text-success font-size-medium">{askingResalePriceFormatted}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-2">
                                                <span class="spec-label">Resale Advisor</span>
                                                <div class="pref-val font-weight-bold">{assignedAgentName}</div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-2">
                                                <span class="spec-label">Sourcing Partners</span>
                                                <div class="pref-val">{assignedPartnersDisplay}</div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 2. Buyer Management Section (Multiple Buyers without overwrite) -->
                                    <div class="sub-card slds-p-around_small slds-card_boundary">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                                            <div>
                                                <span class="font-weight-bold text-uppercase section-subhdr">REGISTERED PROSPECTIVE BUYERS ({buyers.length})</span>
                                                <span class="slds-text-body_xx-small slds-text-color_weak slds-m-left_x-small">Individual prospect records</span>
                                            </div>
                                            <button class="slds-button slds-button_brand slds-button_xx-small" onclick={openAddBuyerModal}>＋ Register New Buyer</button>
                                        </div>

                                        <template lwc:if={hasBuyers}>
                                            <div class="slds-grid slds-wrap slds-gutters_small">
                                                <template for:each={buyers} for:item="b">
                                                    <div key={b.Id} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_small">
                                                        <div class="buyer-card slds-box slds-box_small slds-card_boundary">
                                                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                                                <div class="font-weight-bold font-size-medium">{b.Prospect_Name__c}</div>
                                                                <span class="slds-badge slds-theme_info">{b.Prospect_Status__c}</span>
                                                            </div>
                                                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                                                <span class="spec-label">Budget</span>
                                                                <span class="font-weight-bold text-success">₹{b.Budget__c}</span>
                                                            </div>
                                                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                                                <span class="spec-label">Contact</span>
                                                                <span>{b.Phone__c} · {b.Email__c}</span>
                                                            </div>
                                                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                                                <span class="spec-label">Source</span>
                                                                <span>{b.Lead_Source__c}</span>
                                                            </div>
                                                            <template lwc:if={b.Finance_Notes__c}>
                                                                <div class="slds-m-top_xx-small slds-p-top_xx-small slds-border_top slds-text-body_xx-small slds-text-color_weak">
                                                                    <strong>Financing:</strong> {b.Finance_Notes__c}
                                                                </div>
                                                            </template>
                                                            <div class="slds-m-top_x-small slds-grid slds-grid_align-end">
                                                                <button class="slds-button slds-button_neutral slds-button_xx-small" onclick={openScheduleVisitForBuyer} data-id={b.Id}>Schedule Visit</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_medium">
                                                <p class="slds-text-color_weak slds-m-bottom_small">No buyers registered yet for this listing.</p>
                                                <button class="slds-button slds-button_brand slds-button_small" onclick={openAddBuyerModal}>＋ Register New Buyer</button>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="slds-text-align_center slds-m-top_medium">
                                        <button class="slds-button slds-button_brand" onclick={handleProceedToSiteVisitStage} disabled={isReadOnlyMode}>
                                            Proceed to Site Visits →
                                        </button>
                                    </div>

                                </div>
                            </article>
                        </template>

                        <!-- STAGE 3: SITE VISITS (Per-Buyer Filtering, Upcoming & Past Visits Split) -->
                        <template lwc:if={isResaleSiteVisitStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-around_small slds-border_bottom">
                                    <div class="slds-media__body">
                                        <h2 class="stage-section-title font-weight-bold">STAGE 3: BUYER SITE VISITS</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">Track physical unit viewings per buyer. Each visit is independent and feedback remains unrated until logged.</p>
                                    </div>
                                    <div class="slds-no-flex slds-m-left_small">
                                        <button class="slds-button slds-button_brand site-visit-top-btn" onclick={openScheduleVisitModal} disabled={isReadOnlyMode}>
                                            ＋ Schedule Site Visit
                                        </button>
                                    </div>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    
                                    <!-- Buyer Filter Bar for Site Visits -->
                                    <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small slds-grid slds-grid_vertical-align-center slds-wrap buyer-filter-bar">
                                        <span class="font-weight-bold slds-m-right_small slds-text-body_small">FILTER BY BUYER:</span>
                                        <template for:each={buyerFilterOptions} for:item="bf">
                                            <button key={bf.id} class={bf.buttonClass} onclick={handleSelectBuyerFilter} data-id={bf.id} style="margin-right: 6px; margin-bottom: 2px;">
                                                {bf.name} ({bf.count})
                                            </button>
                                        </template>
                                    </div>

                                    <!-- 3A. Upcoming Scheduled Visits -->
                                    <div class="sub-card slds-p-around_small slds-card_boundary slds-m-bottom_small">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div>
                                                <span class="font-weight-bold text-uppercase section-subhdr">UPCOMING SCHEDULED VISITS</span>
                                                <span class="slds-badge slds-badge_lightest slds-m-left_x-small">{upcomingSiteVisits.length} Scheduled</span>
                                            </div>
                                            <button class="slds-button slds-button_brand slds-button_x-small" onclick={openScheduleVisitModal} disabled={isReadOnlyMode}>
                                                ＋ Schedule Another Visit
                                            </button>
                                        </div>

                                        <template lwc:if={hasUpcomingVisits}>
                                            <template for:each={upcomingSiteVisits} for:item="sv">
                                                <div key={sv.Id} class="site-visit-card slds-box slds-box_small slds-card_boundary slds-m-bottom_small">
                                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap slds-m-bottom_xx-small">
                                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-right_small">
                                                            <lightning-icon icon-name="standard:event" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                            <div>
                                                                <span class="font-weight-bold font-size-medium">{sv.visitDateFormatted} · {sv.visitTime}</span>
                                                                <span class="slds-text-body_small slds-text-color_weak slds-m-left_small">Buyer: <strong class="text-brand">{sv.buyerName}</strong></span>
                                                            </div>
                                                        </div>
                                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-top_xx-small">
                                                            <span class="slds-badge slds-theme_info">Scheduled</span>
                                                        </div>
                                                    </div>

                                                    <div class="slds-grid slds-gutters_small slds-wrap slds-p-around_x-small slds-m-bottom_x-small visit-details-box">
                                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                                            <span class="spec-label">Location / Meeting Point:</span>
                                                            <span class="font-weight-bold slds-m-left_xx-small">{sv.location}</span>
                                                        </div>
                                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                                            <span class="spec-label">Remarks:</span>
                                                            <span class="slds-m-left_xx-small">{sv.remarks}</span>
                                                        </div>
                                                    </div>

                                                    <template lwc:if={isReadOnlyMode}>
                                                        <div class="slds-text-body_xx-small text-muted text-right">Archived Visit Record</div>
                                                    </template>
                                                    <template lwc:else>
                                                        <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center">
                                                            <button class="slds-button slds-button_success slds-button_x-small slds-m-right_x-small" onclick={handleMarkSiteVisitCompleted} data-id={sv.Id}>
                                                                <lightning-icon icon-name="utility:check" size="xx-small" class="slds-m-right_xx-small" variant="inverse"></lightning-icon>
                                                                Mark Completed
                                                            </button>
                                                            <button class="slds-button slds-button_neutral slds-button_x-small" onclick={openRescheduleVisitModal} data-id={sv.Id} data-date={sv.Visit_Date__c} data-time={sv.Visit_Time__c} data-location={sv.Location__c} data-remarks={sv.Remarks__c}>
                                                                <lightning-icon icon-name="utility:event" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                                Reschedule
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </template>
                                        <template lwc:else>
                                            <div class="slds-text-align_center slds-p-around_medium text-muted">
                                                No upcoming site visits scheduled. Click <strong>＋ Schedule Site Visit</strong> to arrange a unit viewing.
                                            </div>
                                        </template>
                                    </div>

                                    <!-- 3B. Past Completed Visits & Feedback -->
                                    <div class="sub-card slds-p-around_small slds-card_boundary">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div>
                                                <span class="font-weight-bold text-uppercase section-subhdr">PAST COMPLETED VISITS & FEEDBACK</span>
                                                <span class="slds-badge slds-badge_lightest slds-m-left_x-small">{pastSiteVisits.length} Completed</span>
                                            </div>
                                        </div>

                                        <template lwc:if={hasPastVisits}>
                                            <template for:each={pastSiteVisits} for:item="sv">
                                                <div key={sv.Id} class="site-visit-card slds-box slds-box_small slds-card_boundary slds-m-bottom_small">
                                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap slds-m-bottom_xx-small">
                                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-right_small">
                                                            <lightning-icon icon-name="standard:event" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                            <div>
                                                                <span class="font-weight-bold font-size-medium">{sv.visitDateFormatted} · {sv.visitTime}</span>
                                                                <span class="slds-text-body_small slds-text-color_weak slds-m-left_small">Buyer: <strong class="text-brand">{sv.buyerName}</strong></span>
                                                            </div>
                                                        </div>
                                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-top_xx-small">
                                                            <span class="slds-badge slds-theme_success">Completed</span>
                                                            <template lwc:if={sv.hasRating}>
                                                                <span class={sv.ratingBadgeClass} style="margin-left: 6px;">★ {sv.Rating__c}</span>
                                                            </template>
                                                            <template lwc:else>
                                                                <span class="slds-badge slds-badge_lightest text-muted" style="margin-left: 6px;">Not Rated</span>
                                                            </template>
                                                        </div>
                                                    </div>

                                                    <div class="slds-grid slds-gutters_small slds-wrap slds-p-around_x-small slds-m-bottom_x-small visit-details-box">
                                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                                            <span class="spec-label">Location:</span>
                                                            <span class="font-weight-bold slds-m-left_xx-small">{sv.location}</span>
                                                        </div>
                                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                                            <span class="spec-label">Feedback / Remarks:</span>
                                                            <span class="slds-m-left_xx-small">{sv.remarks}</span>
                                                        </div>
                                                    </div>

                                                    <template lwc:if={isReadOnlyMode}>
                                                        <div class="slds-text-body_xx-small text-muted text-right">Archived Visit Record</div>
                                                    </template>
                                                    <template lwc:else>
