                                    <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-m-bottom_x-small">
                                        <span class="text-muted slds-text-body_small d-block">Stamp Duty Execution</span>
                                        <span class="text-success font-weight-bold">✓ E-Signed & Ownership Transferred</span>
                                    </div>
                                </div>
                            </article>
                        </template>

                    </template>

                </div>

                <!-- ───────────────────────────────────────────────────────────────── -->
                <!-- RIGHT COLUMN: REAL SALESFORCE ACTIVITY PANEL (25% / 3-of-12)      -->
                <!-- ───────────────────────────────────────────────────────────────── -->
                <div class="slds-col slds-size_12-of-12 slds-large-size_3-of-12 right-activity-col">

                    <article class="slds-card slds-card_boundary activity-panel-card">
                        <div class="activity-panel-header slds-p-around_x-small slds-border_bottom slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                            <span class="activity-title font-weight-bold">ACTIVITY</span>
                            <button class="slds-button slds-button_icon slds-button_icon-border-filled slds-button_icon-x-small" onclick={handleRefreshActivities} title="Refresh Timeline">
                                <lightning-icon icon-name="utility:refresh" size="xx-small"></lightning-icon>
                            </button>
                        </div>

                        <!-- 4 Activity Tabs (Email, Task, Log a Call, Upcoming & Past) -->
                        <div class="activity-composer-box slds-p-around_x-small slds-border_bottom">
                            <div class="slds-tabs_default">
                                <ul class="slds-tabs_default__nav activity-tab-nav" role="tablist">
                                    <li class={emailTabClass} role="presentation">
                                        <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" onclick={selectTabEmail}>Email</a>
                                    </li>
                                    <li class={taskTabClass} role="presentation">
                                        <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" onclick={selectTabTask}>Task</a>
                                    </li>
                                    <li class={callTabClass} role="presentation">
                                        <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" onclick={selectTabCall}>Log Call</a>
                                    </li>
                                    <li class={timelineTabClass} role="presentation">
                                        <a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" onclick={selectTabTimeline}>Timeline</a>
                                    </li>
                                </ul>

                                <!-- EMAIL COMPOSER -->
                                <template lwc:if={isTabEmail}>
                                    <div class="composer-body slds-p-around_x-small">
                                        <lightning-input label="To" value={emailTo} onchange={handleEmailToChange} class="slds-m-bottom_xx-small" variant="label-hidden" placeholder="To: recipient@example.com"></lightning-input>
                                        <lightning-input label="Subject" value={emailSubject} onchange={handleEmailSubjectChange} class="slds-m-bottom_xx-small" variant="label-hidden" placeholder="Subject"></lightning-input>
                                        <lightning-textarea label="Body" value={emailBody} onchange={handleEmailBodyChange} variant="label-hidden" placeholder="Write email body..." rows="3"></lightning-textarea>
                                        <div class="slds-m-top_x-small text-right">
                                            <button class="slds-button slds-button_brand slds-button_x-small" onclick={handleSendEmail}>Send Email →</button>
                                        </div>
                                    </div>
                                </template>

                                <!-- TASK COMPOSER -->
                                <template lwc:if={isTabTask}>
                                    <div class="composer-body slds-p-around_x-small">
                                        <lightning-input label="Subject" value={taskSubject} onchange={handleTaskSubjectChange} class="slds-m-bottom_xx-small" variant="label-hidden" placeholder="Task Subject"></lightning-input>
                                        <lightning-input type="date" label="Due Date" value={taskDueDate} onchange={handleTaskDueDateChange} class="slds-m-bottom_xx-small"></lightning-input>
                                        <lightning-textarea label="Description" value={taskDescription} onchange={handleTaskDescriptionChange} variant="label-hidden" placeholder="Task notes/instructions..." rows="2"></lightning-textarea>
                                        <div class="slds-m-top_x-small text-right">
                                            <button class="slds-button slds-button_brand slds-button_x-small" onclick={handleCreateTask}>Create Task →</button>
                                        </div>
                                    </div>
                                </template>

                                <!-- CALL COMPOSER -->
                                <template lwc:if={isTabCall}>
                                    <div class="composer-body slds-p-around_x-small">
                                        <lightning-input label="Subject" value={callSubject} onchange={handleCallSubjectChange} class="slds-m-bottom_xx-small" variant="label-hidden" placeholder="Call with Owner / Client"></lightning-input>
                                        <lightning-textarea label="Call Notes" value={callComments} onchange={handleCallCommentsChange} variant="label-hidden" placeholder="Log details of conversation..." rows="3"></lightning-textarea>
                                        <div class="slds-m-top_x-small text-right">
                                            <button class="slds-button slds-button_brand slds-button_x-small" onclick={handleLogCall}>Log Call →</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- TIMELINE FEED -->
                        <div class="activity-timeline-scroll slds-p-around_x-small">
                            <span class="timeline-header-label font-weight-bold slds-m-bottom_x-small d-block">UPCOMING & PAST ACTIVITIES</span>
                            <ul class="slds-timeline">
                                <template for:each={activityTimeline} for:item="act">
                                    <li key={act.id} class="slds-m-bottom_x-small">
                                        <div class="timeline-item-card slds-p-around_xx-small slds-card_boundary">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <lightning-icon icon-name={act.iconName} size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                                <div class="slds-grow slds-truncate">
                                                    <span class="font-weight-bold slds-truncate">{act.subject}</span>
                                                    <div class="slds-text-body_xx-small slds-text-color_weak">{act.assignedToName} · {act.formattedDate}</div>
                                                </div>
                                                <template lwc:if={act.showCompleteButton}>
                                                    <button class="slds-button slds-button_icon slds-button_icon-border-filled slds-button_icon-xx-small" onclick={handleCompleteTask} data-id={act.id} title="Mark Completed">
                                                        <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                                    </button>
                                                </template>
                                            </div>
                                            <template lwc:if={act.description}>
                                                <p class="timeline-desc slds-m-top_xx-small">{act.description}</p>
                                            </template>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </article>

                </div>

            </div>

            <!-- ═════════════════════════════════════════════════════════════════════════ -->
            <!-- MODALS (Contextual & Clean)                                               -->
            <!-- ═════════════════════════════════════════════════════════════════════════ -->

            <!-- 1. Edit Owner Preferences Modal -->
            <template lwc:if={showEditPreferencesModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Edit Owner Rental Preferences</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="number" label="Expected Monthly Rent (₹)" value={prefRent} onchange={handlePrefRentChange}></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="number" label="Security Deposit (₹)" value={prefDeposit} onchange={handlePrefDepositChange}></lightning-input>
                                </div>
                            </div>
                            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-combobox label="Furnishing" value={prefFurnishing} options={furnishingOptions} onchange={handlePrefFurnishingChange}></lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-combobox label="Tenant Preference" value={prefTenant} options={tenantOptions} onchange={handlePrefTenantChange}></lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-combobox label="Pet Preference" value={prefPet} options={petOptions} onchange={handlePrefPetChange}></lightning-combobox>
                                </div>
                            </div>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={saveOwnerPreferences}>Save Preferences</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 2. Review Offer Modal (With Preference Comparison) -->
            <template lwc:if={showReviewOfferModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Review Rental Offer: {activeProspect.Prospect_Name__c}</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            
                            <!-- Comparison Table -->
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-bottom_medium">
                                <thead>
                                    <tr>
                                        <th>Term</th>
                                        <th>Owner Preference</th>
                                        <th>Offered by Tenant</th>
                                        <th>Match Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Monthly Rent</td>
                                        <td>₹{request.Expected_Rent__c}</td>
                                        <td><strong>₹{activeProspect.Offered_Rent__c}</strong></td>
                                        <td><span class="badge-match">Within Range</span></td>
                                    </tr>
                                    <tr>
                                        <td>Security Deposit</td>
                                        <td>₹{request.Security_Deposit__c}</td>
                                        <td><strong>₹{activeProspect.Offered_Deposit__c}</strong></td>
                                        <td><span class="badge-match">Exact Match</span></td>
                                    </tr>
                                    <tr>
                                        <td>Tenant Profile</td>
                                        <td>{request.Tenant_Preference__c}</td>
                                        <td><strong>{activeProspect.Tenant_Type__c}</strong></td>
                                        <td><span class="badge-match">Preference Match</span></td>
                                    </tr>
                                    <tr>
                                        <td>Proposed Move-in</td>
                                        <td>{availableFromFormatted}</td>
                                        <td><strong>{activeProspect.Proposed_Move_In_Date__c}</strong></td>
                                        <td><span class="badge-match">Aligned</span></td>
                                    </tr>

                                    <span class="text-muted slds-text-body_small">Agreed Resale Value:</span>
                                    <span class="font-weight-bold text-success">{agreedResalePriceFormatted}</span>
                                </div>
                                <div class="slds-grid slds-grid_align-spread slds-m-top_xx-small">
                                    <span class="text-muted slds-text-body_small">Reference / UTR:</span>
                                    <span class="font-weight-bold">{request.Payment_Reference__c}</span>
                                </div>
                            </div>
                            <lightning-combobox label="Audit Verification Decision" value={fullPayVerifyDecision} options={fullPayVerifyDecisionOptions} onchange={handleFullPayVerifyDecisionChange} class="slds-m-bottom_small" required></lightning-combobox>
                            <lightning-textarea label="Audit / Verification Remarks" value={fullPayVerifyRemarks} onchange={handleFullPayVerifyRemarksChange} placeholder="Enter verification notes..."></lightning-textarea>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={handleSaveVerifyFullPay}>Confirm Verification</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 7. Assign Resale Advisor Modal -->
            <template lwc:if={showAssignResaleModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Assign Resale Lead</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-combobox label="Resale Advisory Team Member" value={selectedAgentId} options={activeUserOptions} onchange={handleAgentChange} class="slds-m-bottom_small" required></lightning-combobox>
                            <lightning-combobox label="Channel Partner / Broker (Optional)" value={selectedBrokerId} options={brokerOptions} onchange={handleBrokerChange}></lightning-combobox>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={saveResaleAssignment}>Confirm Assignment →</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 8. Edit Lease Terms Modal -->
            <template lwc:if={showEditLeaseTermsModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Configure Commercial Lease Terms</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="number" label="Monthly Rent (₹)" value={leaseRent} onchange={handleLeaseRentChange} required></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="number" label="Security Deposit (₹)" value={leaseDeposit} onchange={handleLeaseDepositChange}></lightning-input>
                                </div>
                            </div>
                            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="date" label="Lease Start Date" value={leaseStartDate} onchange={handleLeaseStartDateChange}></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="date" label="Lease End Date" value={leaseEndDate} onchange={handleLeaseEndDateChange}></lightning-input>
                                </div>
                            </div>
                            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-input type="number" label="Lock-in (Months)" value={leaseLockIn} onchange={handleLeaseLockInChange}></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-input type="number" step="0.5" label="Escalation (%)" value={leaseEscalation} onchange={handleLeaseEscalationChange}></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-input type="number" label="Notice Period (Days)" value={leaseNotice} onchange={handleLeaseNoticeChange}></lightning-input>
                                </div>
                            </div>
                            <lightning-combobox label="Maintenance Responsibility" value={leaseMaintenance} options={maintenanceOptions} onchange={handleLeaseMaintenanceChange}></lightning-combobox>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={saveLeaseTerms}>Save Lease Terms</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 9. Add Resale Buyer Modal -->
            <template lwc:if={showAddBuyerModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Register Resale Buyer</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-input label="Buyer Full Name" value={buyerName} onchange={handleBuyerNameChange} class="slds-m-bottom_small" required></lightning-input>
                            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="tel" label="Phone" value={buyerPhone} onchange={handleBuyerPhoneChange}></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="email" label="Email" value={buyerEmail} onchange={handleBuyerEmailChange}></lightning-input>
                                </div>
                            </div>
                            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="number" label="Budget (₹)" value={buyerBudget} onchange={handleBuyerBudgetChange}></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-combobox label="Lead Source" value={buyerSource} options={leadSourceOptions} onchange={handleBuyerSourceChange}></lightning-combobox>
                                </div>
                            </div>
                            <lightning-combobox label="Channel Partner / Sourced By (Optional)" value={buyerBrokerId} options={brokerOptions} onchange={handleBuyerBrokerChange} class="slds-m-bottom_small"></lightning-combobox>
                            <lightning-input label="Financing & Mortgage Notes" value={buyerFinanceNotes} onchange={handleBuyerFinanceNotesChange} class="slds-m-bottom_small" placeholder="Pre-approved bank loan, self-funded, disbursement timeline..."></lightning-input>
                            <lightning-textarea label="Buyer Preferences & Notes" value={buyerPreferences} onchange={handleBuyerPreferencesChange} placeholder="Floor preference, vastu, move-in timeline..."></lightning-textarea>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={saveResaleBuyer}>Register Buyer</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 10. Change Request Owner Modal -->
            <template lwc:if={showChangeOwnerModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Change Request Owner</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-combobox label="New Owner" value={selectedNewOwnerId} options={activeUserOptions} onchange={handleNewOwnerChange} required></lightning-combobox>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={saveNewRequestOwner}>Transfer Ownership</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 11. Reject Resale Modal -->
            <template lwc:if={showRejectResaleModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold text-destructive">Reject Resale Request</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-combobox label="Rejection Reason" value={rejectionReason} options={rejectionReasonOptions} onchange={handleRejectionReasonChange} class="slds-m-bottom_small" required></lightning-combobox>
                            <lightning-textarea label="Rejection Remarks" value={rejectionRemarks} onchange={handleRejectionRemarksChange} placeholder="Explain why the resale is being cancelled..." required></lightning-textarea>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                            <button class="slds-button slds-button_destructive" onclick={saveRejectResale}>Reject Request</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 12. Edit Resale Listing Modal -->
            <template lwc:if={showEditListingModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Configure Property Listing</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-input type="number" label="Asking Resale Price (₹)" value={listingAskingPrice} onchange={handleListingAskingPriceChange} class="slds-m-bottom_small" required></lightning-input>
                            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-combobox label="Listing Status" value={listingStatus} options={listingStatusOptions} onchange={handleListingStatusChange} required></lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="date" label="Listing Date" value={listingDate} onchange={handleListingDateChange}></lightning-input>
                                </div>
                            </div>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={saveListingChanges}>Update Listing</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 13. Verify Document Modal -->
            <template lwc:if={showVerifyDocModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Verify Resale Document</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small">
                                <div class="font-weight-bold">{activeDocName}</div>
                            </div>
                            <lightning-combobox label="Verification Decision" value={docVerifyStatus} options={docDecisionOptions} onchange={handleDocDecisionChange} class="slds-m-bottom_small" required></lightning-combobox>
                            <lightning-textarea label="Verification Remarks" value={docVerifyRemarks} onchange={handleDocVerifyRemarksChange} placeholder="Enter verification notes or reason for rejection..."></lightning-textarea>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={saveVerifyDocument}>Save Verification</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 14. Document Preview Modal (Displays ACTUAL uploaded file - No fake PAN summary) -->
            <template lwc:if={showDocPreviewModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Document Preview: {previewDoc.Document_Type__c}</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <div class="slds-grid slds-gutters_small slds-grid_vertical-align-center slds-m-bottom_small slds-p-bottom_x-small slds-border_bottom">
                                <div class="slds-col slds-size_1-of-3">
                                    <div class="slds-text-title_caps slds-text-color_weak">File Name</div>
                                    <div class="font-weight-bold slds-truncate" title={previewFileName}>{previewFileName}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <div class="slds-text-title_caps slds-text-color_weak">Verification Status</div>
                                    <div><span class={previewDoc.statusClass}>{previewDoc.Status__c}</span></div>
                                </div>
                                <div class="slds-col slds-size_1-of-3 text-right">
                                    <template lwc:if={hasPreviewFile}>
                                        <button class="slds-button slds-button_neutral slds-button_x-small" onclick={handleOpenSalesforceFileViewer} title="Open in Salesforce native viewer">
                                            <lightning-icon icon-name="utility:expand_alt" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                            Fullscreen Viewer
                                        </button>
                                    </template>
                                </div>
                            </div>

                            <!-- ACTUAL FILE VIEWER: Image, PDF iframe, or Salesforce file link -->
                            <div class="actual-file-preview-box">
                                <template lwc:if={isPreviewImage}>
                                    <div class="preview-media-container text-center slds-p-around_small">
                                        <img src={previewFileDownloadUrl} alt={previewDoc.Document_Type__c} class="actual-file-img" />
                                    </div>
                                </template>
                                <template lwc:elseif={isPreviewPdf}>
                                    <div class="preview-media-container">
                                        <iframe src={previewFileDownloadUrl} class="actual-file-frame" title={previewDoc.Document_Type__c}></iframe>
                                    </div>
                                </template>
                                <template lwc:elseif={hasPreviewFile}>
                                    <div class="slds-box slds-theme_shade text-center slds-p-around_large">
                                        <lightning-icon icon-name="doctype:attachment" size="large" class="slds-m-bottom_small"></lightning-icon>
                                        <h3 class="font-weight-bold slds-text-heading_small slds-m-bottom_xx-small">{previewFileName}</h3>
                                        <p class="slds-text-body_small text-muted slds-m-bottom_medium">Uploaded document is attached and ready for viewing.</p>
                                        <button class="slds-button slds-button_brand" onclick={handleOpenSalesforceFileViewer}>
                                            Open in Salesforce Fullscreen Viewer
                                        </button>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div class="slds-box slds-theme_shade text-center slds-p-around_large">
                                        <lightning-icon icon-name="utility:warning" size="medium" variant="warning" class="slds-m-bottom_small"></lightning-icon>
                                        <h3 class="font-weight-bold slds-m-bottom_xx-small">No File Uploaded Yet</h3>
                                        <p class="slds-text-body_small text-muted">Upload an actual document file to view it here.</p>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <footer class="slds-modal__footer slds-grid slds-grid_align-spread">
                            <button class="slds-button slds-button_neutral" onclick={handleDownloadDoc} data-id={previewDoc.Id} disabled={hasNoPreviewFile}>
                                Download Actual File
                            </button>
                            <div>
                                <button class="slds-button slds-button_neutral" onclick={closeModals}>Close</button>
                                <button class="slds-button slds-button_brand" onclick={handleOpenShareModal} data-id={previewDoc.Id} data-name={previewDoc.Document_Type__c}>
                                    Share Document
                                </button>
                            </div>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 15. Document Share Modal -->
            <template lwc:if={showDocShareModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Share Document: {shareDocName}</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-input type="email" label="Recipient Email Address" value={shareRecipientEmail} onchange={handleShareRecipientChange} class="slds-m-bottom_small" required placeholder="name@domain.com"></lightning-input>
                            <lightning-textarea label="Custom Cover Message" value={shareMessage} onchange={handleShareMessageChange} placeholder="Enter message to accompany the document..."></lightning-textarea>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={handleShareDocSubmit}>Send Document →</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- 16. Document Upload Modal (Direct Lightning File Upload) -->
            <template lwc:if={showDocUploadModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModals}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            </button>
                            <h2 class="slds-modal__title font-weight-bold">Upload Document: {uploadDocName}</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                                Upload the actual verified document file for <strong>{uploadDocName}</strong> (Unit {unitInfo.name}). Allowed formats: PDF, PNG, JPG, JPEG, DOCX.
                            </p>
                            <div class="slds-box slds-theme_shade slds-m-bottom_small text-center slds-p-around_medium">
                                <lightning-file-upload
                                    label="Select File from Computer"
                                    name="fileUploader"
                                    accept=".pdf,.png,.jpg,.jpeg,.doc,.docx"
                                    record-id={uploadDocId}
                                    onuploadfinished={handleUploadFinished}>
                                </lightning-file-upload>
                            </div>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeModals}>Cancel</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

        </template>
    </div>
</template>
