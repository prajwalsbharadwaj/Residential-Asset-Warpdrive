                                                        <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center">
                                                            <button class="slds-button slds-button_neutral slds-button_x-small" onclick={openLogVisitFeedbackModal} data-id={sv.Id}>
                                                                <lightning-icon icon-name="utility:feedback" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                                Log Feedback
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </template>
                                        <template lwc:else>
                                            <div class="slds-text-align_center slds-p-around_medium text-muted">
                                                No completed visits yet. Completed visits with buyer feedback will appear here.
                                            </div>
                                        </template>
                                    </div>

                                    <div class="slds-text-align_center slds-m-top_medium">
                                        <button class="slds-button slds-button_brand" onclick={handleProceedToDealFinalisation} disabled={isReadOnlyMode}>
                                            Proceed to Deal Finalisation →
                                        </button>
                                    </div>

                                </div>
                            </article>
                        </template>

                        <!-- STAGE 4: DEAL FINALISATION -->
                        <template lwc:if={isResaleDealFinalisationStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                    <div>
                                        <h2 class="stage-section-title font-weight-bold">STAGE 4: COMMERCIAL DEAL FINALISATION</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">Record final agreed transaction terms negotiated with the buyer to submit for internal approval.</p>
                                    </div>
                                    <template lwc:if={request.Final_Resale_Value__c}>
                                        <button class="slds-button slds-button_neutral slds-button_x-small" onclick={openRecordDealModal} disabled={isReadOnlyMode}>
                                            Modify Commercial Terms
                                        </button>
                                    </template>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    <template lwc:if={request.Final_Resale_Value__c}>
                                        <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small">
                                            <div class="slds-grid slds-gutters_small slds-wrap">
                                                <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                                                    <span class="text-muted slds-text-body_small d-block">Agreed Resale Value</span>
                                                    <span class="font-weight-bold text-success slds-text-title_bold">{agreedResalePriceFormatted}</span>
                                                </div>
                                                <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                                                    <span class="text-muted slds-text-body_small d-block">Agreed Buyer</span>
                                                    <span class="font-weight-bold">{request.Buyer_Name__c}</span>
                                                </div>
                                                <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                                                    <span class="text-muted slds-text-body_small d-block">Token / Booking Deposit</span>
                                                    <span class="font-weight-bold">{tokenAmountFormatted}</span>
                                                </div>
                                                <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                                                    <span class="text-muted slds-text-body_small d-block">Brokerage / Service Fee</span>
                                                    <span class="font-weight-bold">{serviceFeeFormatted}</span>
                                                </div>
                                            </div>
                                            <div class="slds-border_top slds-p-top_x-small slds-m-top_x-small slds-grid slds-gutters_small slds-wrap">
                                                <div class="slds-col slds-size_12-of-12 slds-medium-size_6-of-12">
                                                    <span class="text-muted slds-text-body_small d-block">Payment Terms</span>
                                                    <span>{paymentTermsDisplay}</span>
                                                </div>
                                                <div class="slds-col slds-size_12-of-12 slds-medium-size_6-of-12">
                                                    <span class="text-muted slds-text-body_small d-block">Commercial Remarks</span>
                                                    <span>{commercialRemarksDisplay}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <div class="deal-record-box slds-p-around_medium slds-card_boundary text-center">
                                            <span class="deal-icon">🤝</span>
                                            <h3 class="font-weight-bold slds-m-top_xx-small">Commercial Agreement Finalized</h3>
                                            <p class="slds-text-color_weak slds-m-bottom_medium">Record agreed resale price, buyer, token amount, and payment schedule to proceed to internal Approval.</p>
                                            <button class="slds-button slds-button_brand btn-deal-cta" onclick={openRecordDealModal} disabled={isReadOnlyMode}>
                                                RECORD AGREED DEAL →
                                            </button>
                                        </div>
                                    </template>

                                    <div class="slds-text-align_center slds-m-top_medium">
                                        <button class="slds-button slds-button_brand" onclick={openRecordDealModal} disabled={isReadOnlyMode}>
                                            Record Commercial Deal & Submit for Approval →
                                        </button>
                                    </div>
                                </div>
                            </article>
                        </template>

                        <!-- STAGE 5: APPROVAL -->
                        <template lwc:if={isResaleApprovalStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                    <div>
                                        <h2 class="stage-section-title font-weight-bold">STAGE 5: COMMERCIAL APPROVAL</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">Internal governance and managerial authorization of agreed commercial resale terms.</p>
                                    </div>
                                    <button class="slds-button slds-button_neutral slds-button_x-small" onclick={openApprovalModal} disabled={isReadOnlyMode}>
                                        Review & Decide Approval
                                    </button>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    <!-- Commercial Deal Summary Strip -->
                                    <div class="deal-summary-strip slds-p-around_x-small slds-m-bottom_small slds-grid slds-grid_align-spread slds-wrap">
                                        <div>Agreed Resale Value: <strong>{agreedResalePriceFormatted}</strong></div>
                                        <div>Agreed Buyer: <strong>{request.Buyer_Name__c}</strong></div>
                                        <div>Token Amount: <strong>{tokenAmountFormatted}</strong></div>
                                        <div>Service Fee: <strong>{serviceFeeFormatted}</strong></div>
                                    </div>

                                    <!-- Approval Status Card -->
                                    <div class="slds-card slds-card_boundary slds-p-around_medium slds-m-bottom_small">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <lightning-icon icon-name="standard:approval" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                <div>
                                                    <span class="font-weight-bold d-block">Deal Approval Status</span>
                                                    <span class="slds-text-body_xx-small text-muted">Submission Date: {request.Approval_Submission_Date__c}</span>
                                                </div>
                                            </div>
                                            <div>
                                                <template lwc:if={isApprovalApproved}>
                                                    <span class="slds-badge slds-theme_success">✓ Approved</span>
                                                </template>
                                                <template lwc:elseif={isApprovalRejected}>
                                                    <span class="slds-badge slds-theme_error">✕ Rejected</span>
                                                </template>
                                                <template lwc:else>
                                                    <span class="slds-badge slds-theme_warning">Pending Approval</span>
                                                </template>
                                            </div>
                                        </div>

                                        <div class="slds-box slds-box_x-small slds-theme_shade">
                                            <div class="slds-grid slds-grid_align-spread">
                                                <span class="text-muted slds-text-body_small">Approver:</span>
                                                <span class="font-weight-bold">{approverNameDisplay}</span>
                                            </div>
                                            <div class="slds-grid slds-grid_align-spread slds-m-top_xx-small">
                                                <span class="text-muted slds-text-body_small">Decision Date:</span>
                                                <span>{approvalDateFormatted}</span>
                                            </div>
                                            <div class="slds-grid slds-grid_align-spread slds-m-top_xx-small">
                                                <span class="text-muted slds-text-body_small">Approval Remarks:</span>
                                                <span>{approvalRemarksDisplay}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="slds-text-align_center slds-m-top_medium">
                                        <template lwc:if={isApprovalApproved}>
                                            <div class="text-success font-weight-bold slds-m-bottom_x-small">
                                                ✓ Commercial terms are approved. Ready to proceed to KYC & Token collection.
                                            </div>
                                            <button class="slds-button slds-button_brand" onclick={handleProceedToKycToken} disabled={isReadOnlyMode}>
                                                Proceed to KYC & Token →
                                            </button>
                                        </template>
                                        <template lwc:else>
                                            <div class="text-muted slds-m-bottom_x-small">
                                                Commercial deal must be formally Approved by an authorized manager before advancing to KYC & Token.
                                            </div>
                                            <button class="slds-button slds-button_neutral" disabled title="Deal must be Approved first">
                                                Proceed to KYC & Token (Awaiting Approval 🔒)
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </article>
                        </template>

                        <!-- STAGE 6: KYC & TOKEN PAYMENT -->
                        <template lwc:if={isResaleKycTokenStage}>
                            <div class="stage-box slds-m-bottom_small">
                                <div class="slds-card slds-card_boundary slds-m-bottom_medium">
                                    <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                        <div>
                                            <h2 class="stage-section-title font-weight-bold">STAGE 6: KYC & TOKEN PAYMENT</h2>
                                            <p class="slds-text-body_small slds-text-color_weak">Verify New Buyer KYC compliance and record & generate the official booking token receipt.</p>
                                        </div>
                                        <span class="slds-badge slds-theme_info">Stage 6 of 10</span>
                                    </div>
                                </div>

                                <div class="slds-grid slds-gutters_small slds-wrap">
                                    <!-- Left Card: New Buyer KYC Checklist ONLY -->
                                    <div class="slds-col slds-size_12-of-12 slds-large-size_6-of-12 slds-m-bottom_small">
                                        <article class="slds-card slds-card_boundary kyc-card h-100">
                                            <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                                <div class="slds-grid slds-grid_vertical-align-center">
                                                    <lightning-icon icon-name="standard:user" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                    <div>
                                                        <h3 class="font-weight-bold section-subhdr">BUYER KYC COMPLIANCE</h3>
                                                        <span class="slds-text-body_xx-small text-muted">Buyer: {buyerNameDisplay}</span>
                                                    </div>
                                                </div>
                                                <template lwc:if={allBuyerKycDocsVerified}>
                                                    <span class="slds-badge slds-theme_success">✓ All KYC Verified</span>
                                                </template>
                                                <template lwc:else>
                                                    <span class="slds-badge slds-theme_warning">{buyerKycVerifiedCountDisplay} Verified</span>
                                                </template>
                                            </div>
                                            <div class="slds-card__body slds-p-around_medium">
                                                <div class="slds-m-bottom_small slds-p-around_x-small slds-theme_shade slds-border_bottom" style="border-radius: 4px; font-size: 0.78rem;">
                                                    <span class="slds-text-color_weak">ℹ️ KYC is required <strong>only for the New Buyer</strong>. Existing seller ownership and customer details are verified from property records.</span>
                                                </div>

                                                <!-- Concise 3-item Buyer KYC Checklist -->
                                                <template for:each={buyerKycDocumentsList} for:item="item">
                                                    <div key={item.docType} class="doc-item-box slds-p-around_small slds-card_boundary slds-m-bottom_small">
                                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                            <div class="slds-grid slds-grid_vertical-align-center" style="min-width: 0;">
                                                                <lightning-icon icon-name="doctype:attachment" size="small" class="slds-m-right_x-small slds-shrink-none"></lightning-icon>
                                                                <div style="min-width: 0;">
                                                                    <span class="font-weight-bold d-block slds-truncate" title={item.docType}>{item.docType}</span>
                                                                    <span class="slds-text-body_xx-small text-muted">{item.categoryHelp}</span>
                                                                </div>
                                                            </div>
                                                            <span class={item.statusBadgeClass}>{item.status}</span>
                                                        </div>

                                                        <div class="slds-grid slds-gutters_xx-small slds-m-top_x-small slds-text-body_xx-small text-muted">
                                                            <div class="slds-col slds-size_6-of-12 slds-truncate">
                                                                <strong>Verified By:</strong> {item.verifiedByName}
                                                            </div>
                                                            <div class="slds-col slds-size_6-of-12 slds-truncate">
                                                                <strong>Date:</strong> {item.verifiedDateFormatted}
                                                            </div>
                                                        </div>
                                                        <template lwc:if={item.remarks}>
                                                            <div class="slds-m-top_xx-small slds-text-body_xx-small text-muted slds-truncate" title={item.remarks}>
                                                                <strong>Remarks:</strong> {item.remarks}
                                                            </div>
                                                        </template>

                                                        <!-- UPLOAD → VIEW → VERIFY Action Buttons (Strict 3-State Visibility) -->
                                                        <div class="slds-m-top_small doc-actions-flex">
                                                            <template lwc:if={item.showUploadOnly}>
                                                                <button class="slds-button slds-button_brand slds-button_xx-small" onclick={handleOpenUploadModal} data-id={item.id} data-name={item.docType} disabled={isReadOnlyMode}>
                                                                    Upload
                                                                </button>
                                                            </template>
                                                            <template lwc:if={item.showViewAndVerify}>
                                                                <button class="slds-button slds-button_neutral slds-button_xx-small" onclick={handlePreviewDoc} data-id={item.id}>
                                                                    View
                                                                </button>
                                                                <button class="slds-button slds-button_brand slds-button_xx-small" onclick={openVerifyDocModal} data-id={item.id} data-name={item.docType} disabled={isReadOnlyMode}>
                                                                    Verify
                                                                </button>
                                                            </template>
                                                            <template lwc:if={item.showViewOnly}>
                                                                <button class="slds-button slds-button_neutral slds-button_xx-small" onclick={handlePreviewDoc} data-id={item.id}>
                                                                    View
                                                                </button>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </article>
                                    </div>

                                    <!-- Right Card: Token Payment & Receipt (Clean 3-State Flow) -->
                                    <div class="slds-col slds-size_12-of-12 slds-large-size_6-of-12 slds-m-bottom_small">
                                        <article class="slds-card slds-card_boundary payment-card h-100">
                                            <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                                <div class="slds-grid slds-grid_vertical-align-center">
                                                    <lightning-icon icon-name="standard:currency" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                    <h3 class="font-weight-bold section-subhdr">TOKEN / BOOKING PAYMENT</h3>
                                                </div>
                                                <template lwc:if={isTokenReceiptVerified}>
                                                    <span class="slds-badge slds-theme_success">✓ Verified</span>
                                                </template>
                                                <template lwc:elseif={isTokenReceiptGeneratedPendingVerify}>
                                                    <span class="slds-badge slds-theme_info">Receipt Generated</span>
                                                </template>
                                                <template lwc:else>
                                                    <span class="slds-badge slds-theme_warning">Payment Pending</span>
                                                </template>
                                            </div>
                                            <div class="slds-card__body slds-p-around_medium">
                                                <!-- 1. Initial State: Show ONLY ONE primary button: GENERATE TOKEN RECEIPT -->
                                                <template lwc:if={isTokenReceiptPending}>
                                                    <div class="token-empty-state-box slds-p-around_large text-center slds-m-bottom_small">
                                                        <lightning-icon icon-name="utility:moneybag" size="medium" class="slds-m-bottom_x-small"></lightning-icon>
                                                        <h4 class="font-weight-bold slds-text-title_bold slds-m-bottom_xx-small">Booking Token Payment</h4>
                                                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                                                            Capture token payment details and generate the official booking token receipt for the New Buyer.
                                                        </p>
                                                        <button class="slds-button slds-button_brand slds-button_stretch" onclick={openGenerateTokenReceiptModal} disabled={isReadOnlyMode}>
                                                            GENERATE TOKEN RECEIPT
                                                        </button>
                                                    </div>
                                                </template>

                                                <!-- 2. Receipt Generated (Pending Verification): Show DOWNLOAD + VERIFY -->
                                                <template lwc:if={isTokenReceiptGeneratedPendingVerify}>
                                                    <div class="token-receipt-card slds-p-around_small slds-card_boundary slds-m-bottom_small">
                                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-border_bottom slds-p-bottom_x-small slds-m-bottom_x-small">
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <lightning-icon icon-name="doctype:pdf" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                                <div>
                                                                    <span class="font-weight-bold d-block slds-text-body_small">Official Token Receipt</span>
                                                                    <span class="slds-text-body_xx-small text-muted">{tokenReceiptNumber}</span>
                                                                </div>
                                                            </div>
                                                            <span class="slds-badge slds-theme_info">Receipt Generated</span>
                                                        </div>

                                                        <!-- Receipt Attributes -->
                                                        <div class="receipt-fields-table slds-m-bottom_small">
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Receipt Number:</span>
                                                                <span class="receipt-val font-weight-bold">{tokenReceiptNumber}</span>
                                                            </div>
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Buyer Name:</span>
                                                                <span class="receipt-val">{buyerNameDisplay}</span>
                                                            </div>
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Property / Unit:</span>
                                                                <span class="receipt-val">Unit {unitInfo.name}, {unitInfo.projectName}</span>
                                                            </div>
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Token Amount:</span>
                                                                <span class="receipt-val font-weight-bold text-success">{tokenAmountFormatted}</span>
                                                            </div>
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Payment Date:</span>
                                                                <span class="receipt-val">{tokenPaymentDateFormatted}</span>
                                                            </div>
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Mode & Reference:</span>
                                                                <span class="receipt-val slds-truncate" title={request.Token_Payment_Reference__c}>{request.Token_Payment_Mode__c} · {request.Token_Payment_Reference__c}</span>
                                                            </div>
                                                        </div>

                                                        <!-- DOWNLOAD + VERIFY Action Buttons -->
                                                        <div class="slds-grid slds-gutters_x-small">
                                                            <div class="slds-col slds-size_1-of-2">
                                                                <button class="slds-button slds-button_neutral w-100" onclick={handleDownloadTokenReceipt}>
                                                                    Download
                                                                </button>
                                                            </div>
                                                            <div class="slds-col slds-size_1-of-2">
                                                                <button class="slds-button slds-button_brand w-100" onclick={handleVerifyTokenReceipt} disabled={isReadOnlyMode}>
                                                                    Verify
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>

                                                <!-- 3. Receipt Verified: Shows DOWNLOAD only -->
                                                <template lwc:if={isTokenReceiptVerified}>
                                                    <div class="token-receipt-card slds-p-around_small slds-card_boundary slds-m-bottom_small">
                                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-border_bottom slds-p-bottom_x-small slds-m-bottom_x-small">
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <lightning-icon icon-name="doctype:pdf" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                                <div>
                                                                    <span class="font-weight-bold d-block slds-text-body_small">Official Token Receipt</span>
                                                                    <span class="slds-text-body_xx-small text-muted">{tokenReceiptNumber}</span>
                                                                </div>
                                                            </div>
                                                            <span class="slds-badge slds-theme_success">✓ Verified</span>
                                                        </div>

                                                        <!-- Receipt Attributes -->
                                                        <div class="receipt-fields-table slds-m-bottom_small">
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Receipt Number:</span>
                                                                <span class="receipt-val font-weight-bold">{tokenReceiptNumber}</span>
                                                            </div>
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Buyer Name:</span>
                                                                <span class="receipt-val">{buyerNameDisplay}</span>
                                                            </div>
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Property / Unit:</span>
                                                                <span class="receipt-val">Unit {unitInfo.name}, {unitInfo.projectName}</span>
                                                            </div>
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Token Amount:</span>
                                                                <span class="receipt-val font-weight-bold text-success">{tokenAmountFormatted}</span>
                                                            </div>
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Payment Date:</span>
                                                                <span class="receipt-val">{tokenPaymentDateFormatted}</span>
                                                            </div>
                                                            <div class="receipt-row">
                                                                <span class="receipt-lbl">Mode & Reference:</span>
                                                                <span class="receipt-val slds-truncate" title={request.Token_Payment_Reference__c}>{request.Token_Payment_Mode__c} · {request.Token_Payment_Reference__c}</span>
                                                            </div>
                                                        </div>

                                                        <!-- DOWNLOAD ONLY Action Button -->
                                                        <div>
                                                            <button class="slds-button slds-button_neutral w-100" onclick={handleDownloadTokenReceipt}>
                                                                Download
                                                            </button>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </article>
                                    </div>
                                </div>

                                <!-- Gated Transition to Allotment / Welcome -->
                                <div class="slds-card slds-card_boundary slds-p-around_medium text-center slds-m-top_small">
                                    <template lwc:if={canProceedToAllotment}>
                                        <div class="text-success font-weight-bold slds-m-bottom_x-small">
                                            ✓ All New Buyer KYC documents are verified, and the official Token Payment Receipt has been verified.
                                        </div>
                                        <button class="slds-button slds-button_brand" onclick={handleProceedToAllotment} disabled={isReadOnlyMode}>
                                            Proceed to Allotment / Welcome →
                                        </button>
                                    </template>
                                    <template lwc:else>
                                        <div class="text-muted slds-m-bottom_x-small">
                                            Verify all mandatory New Buyer KYC documents and verify the Token Payment Receipt above to unlock Stage 7.
                                        </div>
                                        <button class="slds-button slds-button_neutral" disabled title="New Buyer KYC and Token Receipt verification required">
                                            Proceed to Allotment / Welcome (Locked 🔒)
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- STAGE 7: ALLOTMENT / WELCOME -->
                        <template lwc:if={isResaleAllotmentStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                    <div>
                                        <h2 class="stage-section-title font-weight-bold">STAGE 7: ALLOTMENT / WELCOME LETTERS</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">Generate official transaction letters using existing Booking document templates for the New Buyer.</p>
                                    </div>
                                    <span class="slds-badge slds-theme_info">Stage 7 of 10</span>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    <div class="slds-grid slds-gutters_small slds-wrap">
                                        <template for:each={allotmentDocumentsList} for:item="ad">
                                            <div key={ad.Document_Type__c} class="slds-col slds-size_12-of-12 slds-large-size_4-of-12 slds-m-bottom_small">
                                                <div class="slds-card slds-card_boundary h-100 slds-p-around_small">
                                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                                                        <lightning-icon icon-name="doctype:pdf" size="small"></lightning-icon>
                                                        <span class={ad.statusClass}>{ad.Status__c}</span>
                                                    </div>
                                                    <div class="font-weight-bold slds-m-bottom_xx-small">{ad.Document_Type__c}</div>
                                                    <p class="slds-text-body_xx-small text-muted slds-m-bottom_small">{ad.Remarks__c}</p>
                                                    
                                                    <!-- Buttons / Actions: Show ONLY GENERATE → DOWNLOAD (No upload, verify, share, approval, or clutter) -->
                                                    <div>
                                                        <template lwc:if={ad.isPending}>
                                                            <button class="slds-button slds-button_brand slds-button_small w-100" onclick={handleGenerateDoc} data-id={ad.Id} disabled={isReadOnlyMode}>
                                                                Generate
                                                            </button>
                                                        </template>
                                                        <template lwc:if={ad.isGenerated}>
                                                            <button class="slds-button slds-button_neutral slds-button_small w-100" onclick={handleDownloadDoc} data-id={ad.Id}>
                                                                Download
                                                            </button>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="slds-card slds-card_boundary slds-p-around_medium text-center slds-m-top_small">
                                        <template lwc:if={allAllotmentDocsGenerated}>
                                            <div class="text-success font-weight-bold slds-m-bottom_x-small">
                                                ✓ All 3 allotment & welcome letters are generated.
                                            </div>
                                            <button class="slds-button slds-button_brand" onclick={handleProceedToFullPayment} disabled={isReadOnlyMode}>
                                                Proceed to Full Payment & Receipt →
                                            </button>
                                        </template>
                                        <template lwc:else>
                                            <div class="text-muted slds-m-bottom_x-small">
                                                Generate Allotment Letter, Welcome Letter, and Car Parking Letter to unlock Stage 8.
                                            </div>
                                            <button class="slds-button slds-button_neutral" disabled title="All 3 allotment letters must be generated">
                                                Proceed to Full Payment & Receipt (Locked 🔒)
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </article>
                        </template>

                        <!-- STAGE 8: FULL PAYMENT & RECEIPT -->
                        <template lwc:if={isResaleFullPaymentStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                    <div>
                                        <h2 class="stage-section-title font-weight-bold">STAGE 8: FULL PAYMENT & RECEIPT</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">Track financial settlement balance, record final disbursement, and reconcile payment receipt.</p>
                                    </div>
                                    <span class="slds-badge slds-theme_info">Stage 8 of 10</span>
                                </div>
                                <div class="slds-card__body slds-p-around_small">
                                    <!-- Balance Tracker Grid -->
                                    <div class="balance-tracker-grid slds-m-bottom_medium">
                                        <div class="balance-tile">
                                            <span class="balance-label">Total Resale Value</span>
                                            <span class="balance-val">{agreedResalePriceFormatted}</span>
                                        </div>
                                        <div class="balance-tile">
                                            <span class="balance-label">Token Paid</span>
                                            <span class="balance-val text-success">{tokenAmountFormatted}</span>
                                        </div>
                                        <div class="balance-tile highlight">
                                            <span class="balance-label">Balance Payable</span>
                                            <span class="balance-val text-primary font-weight-bold">{balancePayableFormatted}</span>
                                        </div>
                                        <div class="balance-tile">
                                            <span class="balance-label">Audit Status</span>
                                            <div><span class={fullPaymentStatusBadgeClass}>{request.Full_Payment_Status__c}</span></div>
                                        </div>
                                    </div>

                                    <!-- Payment Details & Receipt Card -->
                                    <div class="slds-card slds-card_boundary slds-p-around_medium slds-m-bottom_small">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <lightning-icon icon-name="standard:currency" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                <h3 class="font-weight-bold section-subhdr">FULL PAYMENT SETTLEMENT DETAILS</h3>
                                            </div>
                                            <button class="slds-button slds-button_neutral slds-button_x-small" onclick={openFullPaymentModal} disabled={isReadOnlyMode}>
                                                Record / Edit Settlement
                                            </button>
                                        </div>
                                        <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small">
                                            <div class="slds-grid slds-gutters_small slds-wrap">
                                                <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12">
                                                    <span class="text-muted slds-text-body_small d-block">Settlement Date:</span>
                                                    <span class="font-weight-bold">{fullPaymentDateFormatted}</span>
                                                </div>
                                                <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12">
                                                    <span class="text-muted slds-text-body_small d-block">Payment Mode:</span>
                                                    <span>{request.Full_Payment_Mode__c}</span>
                                                </div>
                                                <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12">
                                                    <span class="text-muted slds-text-body_small d-block">Reference / UTR:</span>
                                                    <span class="font-weight-bold">{request.Payment_Reference__c}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <template lwc:if={fullPaymentDoc}>
                                            <div class="doc-item-box slds-p-around_small slds-card_boundary">
                                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                    <div class="slds-grid slds-grid_vertical-align-center">
                                                        <lightning-icon icon-name="doctype:pdf" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                        <div>
                                                            <span class="font-weight-bold d-block">{fullPaymentDoc.Document_Type__c}</span>
                                                            <span class="slds-text-body_xx-small text-muted">{fullPaymentDoc.Remarks__c}</span>
                                                        </div>
                                                    </div>
                                                    <span class={fullPaymentDoc.statusClass}>{fullPaymentDoc.Status__c}</span>
                                                </div>
                                                <div class="slds-grid slds-grid_align-spread slds-m-top_small slds-grid_vertical-align-center">
                                                    <div class="slds-button-group" role="group">
                                                        <button class="slds-button slds-button_neutral slds-button_xx-small" onclick={handleGenerateDoc} data-id={fullPaymentDoc.Id} disabled={isReadOnlyMode}>Generate Receipt</button>
                                                        <button class="slds-button slds-button_neutral slds-button_xx-small" onclick={handleOpenUploadModal} data-id={fullPaymentDoc.Id} data-name={fullPaymentDoc.Document_Type__c} disabled={isReadOnlyMode}>Upload</button>
                                                        <button class="slds-button slds-button_neutral slds-button_xx-small" onclick={handlePreviewDoc} data-id={fullPaymentDoc.Id}>Preview</button>
                                                        <button class="slds-button slds-button_neutral slds-button_xx-small" onclick={handleDownloadDoc} data-id={fullPaymentDoc.Id}>Download</button>
                                                        <template lwc:if={fullPaymentDoc.canVerify}>
                                                            <button class="slds-button slds-button_brand slds-button_xx-small" onclick={openVerifyFullPayModal} disabled={isReadOnlyMode}>Verify Payment</button>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="slds-card slds-card_boundary slds-p-around_medium text-center slds-m-top_small">
                                        <template lwc:if={canProceedToTransferDocs}>
                                            <div class="text-success font-weight-bold slds-m-bottom_x-small">
                                                ✓ Full balance payment received and verified.
                                            </div>
                                            <button class="slds-button slds-button_brand" onclick={handleProceedToTransferDocs} disabled={isReadOnlyMode}>
                                                Proceed to Ownership Transfer Documentation →
                                            </button>
                                        </template>
                                        <template lwc:else>
                                            <div class="text-muted slds-m-bottom_x-small">
                                                Record and verify the Full Payment Receipt to unlock ownership transfer documentation.
                                            </div>
                                            <button class="slds-button slds-button_neutral" disabled title="Full payment must be verified">
                                                Proceed to Ownership Transfer Documentation (Locked 🔒)
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </article>
                        </template>

                        <!-- STAGE 9: OWNERSHIP TRANSFER / STAMP DUTY -->
                        <template lwc:if={isResaleDocumentationTransferStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small">
                                <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                    <div>
                                        <h2 class="stage-section-title font-weight-bold">STAGE 9: OWNERSHIP TRANSFER / STAMP DUTY</h2>
                                        <p class="slds-text-body_small slds-text-color_weak">Standard Salesforce e-signature integration for statutory Stamp Duty conveyance deed and ownership execution.</p>
                                    </div>
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <span class="slds-badge slds-theme_info slds-m-right_x-small">Stage 9 of 10</span>
                                        <button class="slds-button slds-button_destructive-neutral slds-button_x-small" onclick={openRejectResaleModal} disabled={isReadOnlyMode}>
                                            Reject Resale
                                        </button>
                                    </div>
                                </div>
                                <div class="slds-card__body slds-p-around_small">

                                    <!-- Auto-populated Transaction Particulars Banner -->
                                    <div class="stamp-duty-summary-box slds-p-around_small slds-card_boundary slds-m-bottom_medium">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <lightning-icon icon-name="standard:contract" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                <span class="font-weight-bold section-subhdr">STAMP DUTY PARTICULARS (AUTO-POPULATED)</span>
                                            </div>
                                            <span class="slds-badge slds-theme_shade">No Manual Data Entry Required</span>
                                        </div>
                                        <p class="slds-text-body_xx-small text-muted slds-m-bottom_small">
                                            Salesforce automatically populates the Stamp Duty document using verified Resale, Buyer, Seller, and Property records.
                                        </p>

                                        <div class="slds-grid slds-gutters_small slds-wrap">
                                            <!-- Property Particulars -->
                                            <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                                                <div class="particulars-tile">
                                                    <span class="text-muted slds-text-body_xx-small d-block font-weight-bold">PROPERTY PARTICULARS</span>
                                                    <div class="font-weight-bold slds-text-body_regular">{unitInfo.name}</div>
                                                    <div class="slds-text-body_xx-small text-muted">{unitInfo.towerName} · {unitInfo.floorName}</div>
                                                    <div class="slds-text-body_xx-small">{unitInfo.config} · {unitInfo.carpetArea} sq.ft.</div>
                                                    <div class="slds-text-body_xx-small text-muted">{unitInfo.projectName}</div>
                                                </div>
                                            </div>

                                            <!-- Transferor / Seller -->
                                            <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                                                <div class="particulars-tile">
                                                    <span class="text-muted slds-text-body_xx-small d-block font-weight-bold">TRANSFEROR (SELLER)</span>
                                                    <div class="font-weight-bold slds-text-body_regular">{customerInfo.name}</div>
                                                    <template lwc:if={hasCoOwner}>
                                                        <div class="slds-text-body_xx-small text-muted">Co-Owner: {request.Co_Owner_Name__c}</div>
                                                    </template>
                                                    <div class="slds-text-body_xx-small text-muted">Original Allottee / Owner</div>
                                                    <div class="slds-text-body_xx-small text-success font-weight-bold">✓ KYC Verified in Booking</div>
                                                </div>
                                            </div>

                                            <!-- Transferee / Buyer -->
                                            <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                                                <div class="particulars-tile">
                                                    <span class="text-muted slds-text-body_xx-small d-block font-weight-bold">TRANSFEREE (BUYER)</span>
                                                    <div class="font-weight-bold slds-text-body_regular">{request.Buyer_Name__c}</div>
                                                    <div class="slds-text-body_xx-small text-muted">{request.Buyer_Email__c}</div>
                                                    <div class="slds-text-body_xx-small text-muted">{request.Buyer_Phone__c}</div>
                                                    <div class="slds-text-body_xx-small text-success font-weight-bold">✓ New Buyer KYC Verified</div>
                                                </div>
                                            </div>

                                            <!-- Commercial & Duty Calculation -->
                                            <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                                                <div class="particulars-tile highlight-tile">
                                                    <span class="text-muted slds-text-body_xx-small d-block font-weight-bold">STATUTORY CONSIDERATION</span>
                                                    <div class="font-weight-bold text-primary slds-text-body_regular">{agreedResalePriceFormatted}</div>
                                                    <div class="slds-text-body_xx-small text-muted">Stamp Duty (5%): <strong>{stampDutyAmountFormatted}</strong></div>
                                                    <div class="slds-text-body_xx-small text-muted">Surcharge (1%): <strong>{stampSurchargeFormatted}</strong></div>
                                                    <div class="slds-text-body_xx-small font-weight-bold text-success">Total Duty: {stampTotalFormatted}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- STAMP DUTY DOCUMENT & E-SIGN INTEGRATION CARD -->
                                    <div class="slds-card slds-card_boundary slds-p-around_medium stamp-duty-integration-card slds-m-bottom_medium">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <lightning-icon icon-name="doctype:contract" size="medium" class="slds-m-right_small"></lightning-icon>
                                                <div>
                                                    <h3 class="font-weight-bold slds-text-heading_small">STAMP DUTY DOCUMENT</h3>
                                                    <p class="slds-text-body_xx-small text-muted">State Revenue & Stamps Department e-Conveyance Deed · Salesforce E-Sign Integration</p>
                                                </div>
                                            </div>

                                            <!-- Status Indicator Badge -->
                                            <div>
                                                <template lwc:if={isStampDutySigned}>
                                                    <span class="slds-badge slds-theme_success font-weight-bold">✓ Signed</span>
                                                </template>
                                                <template lwc:elseif={isStampDutyPendingSignature}>
                                                    <span class="slds-badge slds-theme_warning font-weight-bold esign-pulse-badge">● Pending Signature</span>
                                                </template>
                                                <template lwc:elseif={isStampDutyGenerated}>
                                                    <span class="slds-badge slds-theme_info font-weight-bold">Document Generated</span>
                                                </template>
                                                <template lwc:else>
                                                    <span class="slds-badge slds-theme_shade">Pending Generation</span>
                                                </template>
                                            </div>
                                        </div>

                                        <!-- Integration Progress Flow Tracker -->
                                        <div class="esign-flow-steps slds-m-vertical_small">
                                            <div class={step1Class}>
                                                <span class="step-num">1</span>
                                                <span class="step-label">Generate Document</span>
                                            </div>
                                            <div class="step-connector"></div>
                                            <div class={step2Class}>
                                                <span class="step-num">2</span>
                                                <span class="step-label">Send for Signature</span>
                                            </div>
                                            <div class="step-connector"></div>
                                            <div class={step3Class}>
                                                <span class="step-num">3</span>
                                                <span class="step-label">Pending Signature</span>
                                            </div>
                                            <div class="step-connector"></div>
                                            <div class={step4Class}>
                                                <span class="step-num">4</span>
                                                <span class="step-label">Signed & Download</span>
                                            </div>
                                        </div>

                                        <!-- State 1: Pending Generation -->
                                        <template lwc:if={isStampDutyPendingGeneration}>
                                            <div class="esign-state-box text-center slds-p-around_medium slds-theme_shade slds-m-top_small">
                                                <div class="slds-text-body_small slds-m-bottom_small">
                                                    The conveyance deed is ready to be generated with pre-filled Buyer, Seller, Unit, and Consideration details.
                                                </div>
                                                <button class="slds-button slds-button_brand" onclick={handleGenerateStampDutyDoc} disabled={isReadOnlyMode}>
                                                    <lightning-icon icon-name="utility:new_window" size="x-small" class="slds-m-right_xx-small" variant="inverse"></lightning-icon>
                                                    GENERATE STAMP DUTY
                                                </button>
                                            </div>
                                        </template>

                                        <!-- State 2: Document Generated -->
                                        <template lwc:if={isStampDutyGenerated}>
                                            <div class="esign-state-box slds-p-around_medium slds-theme_shade slds-m-top_small">
                                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                    <div>
                                                        <div class="font-weight-bold text-success slds-m-bottom_xx-small">
                                                            ✓ Document Generated Successfully
                                                        </div>
                                                        <div class="slds-text-body_small">
                                                            Title: <strong>{stampDutyDocTitle}</strong>
                                                        </div>
                                                        <div class="slds-text-body_xx-small text-muted slds-m-top_xx-small">
                                                            Auto-populated with Unit {unitInfo.name}, Buyer {request.Buyer_Name__c}, and Seller {customerInfo.name}.
                                                        </div>
                                                    </div>
                                                    <div class="slds-button-group">
                                                        <button class="slds-button slds-button_neutral" onclick={handlePreviewStampDutyDoc}>
                                                            Preview
                                                        </button>
                                                        <button class="slds-button slds-button_brand" onclick={handleSendStampDutyForSignature} disabled={isReadOnlyMode}>
                                                            <lightning-icon icon-name="utility:edit" size="x-small" class="slds-m-right_xx-small" variant="inverse"></lightning-icon>
                                                            SEND FOR SIGNATURE
                                                        </button>
                                                    </div>
                                                </div>
                                                <div class="slds-text-body_xx-small text-muted slds-m-top_small">
                                                    Dispatches through standard Salesforce E-Sign Provider (DocuSign / Adobe Sign / Salesforce Sign).
                                                </div>
                                            </div>
                                        </template>

                                        <!-- State 3: Signature Status: Pending -->
                                        <template lwc:if={isStampDutyPendingSignature}>
                                            <div class="esign-state-box slds-p-around_medium slds-box_warning-subtle slds-m-top_small">
                                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                    <div>
                                                        <div class="font-weight-bold slds-text-color_warning slds-m-bottom_xx-small">
                                                            ● Signature Status: Pending
                                                        </div>
                                                        <div class="slds-text-body_small">
                                                            Sent to Transferee: <strong>{request.Buyer_Name__c}</strong> ({request.Buyer_Email__c})
                                                        </div>
                                                        <div class="slds-text-body_xx-small text-muted slds-m-top_xx-small">
                                                            Envelope ID: <strong class="font-family-mono">{stampDutyEnvelopeId}</strong> · Provider: Standard E-Sign
                                                        </div>
                                                        <div class="slds-text-body_xx-small text-muted">
                                                            Dispatched activity recorded in Salesforce Activity Timeline.
                                                        </div>
                                                    </div>
                                                    <div class="slds-button-group">
                                                        <button class="slds-button slds-button_neutral" onclick={handlePreviewStampDutyDoc}>
                                                            Preview
                                                        </button>
                                                        <button class="slds-button slds-button_brand" onclick={handleCompleteStampDutySignature} title="Simulate callback from E-Sign provider" disabled={isReadOnlyMode}>
                                                            <lightning-icon icon-name="utility:check" size="x-small" class="slds-m-right_xx-small" variant="inverse"></lightning-icon>
                                                            Complete E-Signature (Simulate)
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>

                                        <!-- State 4: E-Signature Completed / Signed -->
                                        <template lwc:if={isStampDutySigned}>
                                            <div class="esign-state-box slds-p-around_medium slds-box_success-subtle slds-m-top_small">
                                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                    <div>
                                                        <div class="font-weight-bold text-success slds-m-bottom_xx-small">
                                                            ✓ E-Signature Completed & Verified
                                                        </div>
                                                        <div class="slds-text-body_small">
                                                            Digitally signed by <strong>{request.Buyer_Name__c}</strong> ({request.Buyer_Email__c})
                                                        </div>
                                                        <div class="slds-text-body_xx-small text-muted slds-m-top_xx-small">
                                                            {stampDutyDoc.Remarks__c}
                                                        </div>
                                                        <div class="slds-text-body_xx-small text-success font-weight-bold slds-m-top_xx-small">
                                                            ✓ Cryptographic audit trail & certificate secured in Salesforce record
                                                        </div>
                                                    </div>
                                                    <div class="slds-button-group">
                                                        <button class="slds-button slds-button_neutral" onclick={handlePreviewStampDutyDoc}>
                                                            Preview
                                                        </button>
                                                        <button class="slds-button slds-button_brand" onclick={handleDownloadStampDutyDoc}>
                                                            <lightning-icon icon-name="utility:download" size="x-small" class="slds-m-right_xx-small" variant="inverse"></lightning-icon>
                                                            DOWNLOAD
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Final Closure Gating Container -->
                                    <div class="slds-card slds-card_boundary slds-p-around_medium text-center slds-m-top_small">
                                        <template lwc:if={isStampDutySigned}>
                                            <div class="text-success font-weight-bold slds-m-bottom_x-small">
                                                ✓ Stamp Duty Document is signed. Resale is now eligible for closure.
                                            </div>
                                            <button class="slds-button slds-button_brand slds-button_stretch" onclick={handleCloseResaleTransaction} disabled={isReadOnlyMode}>
                                                Complete Ownership Transfer & Close Resale →
                                            </button>
                                        </template>
                                        <template lwc:else>
                                            <div class="text-muted slds-m-bottom_x-small">
                                                Stamp Duty Document must be generated, sent for signature, and Signed before closure.
                                            </div>
                                            <button class="slds-button slds-button_neutral slds-button_stretch" disabled title="Stamp Duty document must be signed first">
                                                Complete Ownership Transfer & Close Resale (Locked 🔒 - Pending Signature)
                                            </button>
                                        </template>
                                    </div>

                                </div>
                            </article>
                        </template>

                        <!-- STAGE 10: CLOSED RESALE HERO -->
                        <template lwc:if={isResaleClosedStage}>
                            <article class="slds-card slds-card_boundary stage-box slds-m-bottom_small text-center slds-p-around_large hero-completion-card">
                                <div class="completed-hero-ascii font-weight-bold text-success slds-m-bottom_small">
                                    ✓ RESALE TRANSACTION COMPLETED & CLOSED
                                </div>
                                <h3 class="completed-hero-title font-weight-bold">
                                    Unit {unitInfo.name} successfully transferred to {request.Buyer_Name__c}
                                </h3>
                                <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                    Final Resale Value: <strong>{agreedResalePriceFormatted}</strong>
                                </div>
                                <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                    Closure Date: <strong>{closureDateFormatted}</strong> · Closed By: <strong>{closedByName}</strong>
                                </div>
                                <div class="slds-box slds-box_x-small slds-theme_shade slds-m-top_medium slds-grid slds-gutters_small slds-wrap">
                                    <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-m-bottom_x-small">
                                        <span class="text-muted slds-text-body_small d-block">KYC & Token Compliance</span>
                                        <span class="text-success font-weight-bold">✓ Verified</span>
                                    </div>
                                    <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-m-bottom_x-small">
                                        <span class="text-muted slds-text-body_small d-block">Full Financial Settlement</span>
                                        <span class="text-success font-weight-bold">✓ {agreedResalePriceFormatted} Settled</span>
                                    </div>
