<template>
    <div class="slds-theme_default main-page-wrapper">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading Handover Workspace..." size="medium"></lightning-spinner>
        </template>

        <template lwc:if={handover}>
            <!-- ================= WORKSPACE STAGE SUBNAV ================= -->
            <div class="workspace-stage-bar slds-m-bottom_medium slds-p-horizontal_small slds-p-vertical_x-small slds-card slds-card_boundary slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                    <span class="stage-bar-label font-weight-bold slds-m-right_small">STAGE WORKSPACE:</span>
                    <div class="slds-button-group" role="group">
                        <button class={btnClassReadiness} onclick={handleSelectStage} data-stage="Readiness" title="Stage 1: Readiness Gate">
                            <span class="stage-step-num">1</span> Readiness Gate
                            <template lwc:if={isReadinessLocked}>
                                <lightning-icon icon-name="utility:lock" size="xx-small" class="slds-m-left_xx-small"></lightning-icon>
                            </template>
                        </button>
                        <button class={btnClassInspection} onclick={handleSelectStage} data-stage="Inspection" title="Stage 2: Comprehensive Unit Quality Audit">
                            <span class="stage-step-num">2</span> Inspection &amp; Audit
                            <template lwc:if={isInspectionLocked}>
                                <lightning-icon icon-name="utility:lock" size="xx-small" class="slds-m-left_xx-small"></lightning-icon>
                            </template>
                        </button>
                        <button class={btnClassResolution} onclick={handleSelectStage} data-stage="Resolution" title="Stage 3: Snag & Defect Rectification">
                            <span class="stage-step-num">3</span> Snag Resolution
                            <template lwc:if={isResolutionLocked}>
                                <lightning-icon icon-name="utility:lock" size="xx-small" class="slds-m-left_xx-small"></lightning-icon>
                            </template>
                        </button>
                        <button class={btnClassAppointment} onclick={handleSelectStage} data-stage="Appointment" title="Stage 4: Handover Appointment & Sign-off">
                            <span class="stage-step-num">4</span> Appointment &amp; Handover
                            <template lwc:if={isAppointmentLocked}>
                                <lightning-icon icon-name="utility:lock" size="xx-small" class="slds-m-left_xx-small"></lightning-icon>
                            </template>
                        </button>
                        <button class={btnClassCompleted} onclick={handleSelectStage} data-stage="Completed" title="Stage 5: Handover Completed">
                            <span class="stage-step-num">5</span> Completed
                        </button>
                    </div>
                </div>
                <template lwc:if={isReviewMode}>
                    <div class="review-mode-indicator slds-grid slds-grid_vertical-align-center">
                        <span class="slds-badge slds-theme_warning slds-m-right_x-small">Review Mode (Locked Stage)</span>
                        <lightning-button size="x-small" variant="neutral" label="Return to Active Stage" onclick={handleReturnToActiveStage}></lightning-button>
                    </div>
                </template>
            </div>

            <!-- ================= WORKSPACE STAGES (FULL WIDTH) ================= -->
            <div class="workspace-stages-container slds-m-bottom_medium">
                <!-- ------------------------------------------------ -->
                            <template lwc:if={isStageReadiness}>
                                <article class="slds-card slds-card_boundary slds-p-around_medium stage-card">
                                    <!-- Stage 1 Locked Banner (Review Mode) -->
                                    <template lwc:if={isReadinessLocked}>
                                        <div class="stage-locked-banner slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_medium slds-grid slds-grid_vertical-align-center">
                                            <span class="stage-lock-badge slds-badge slds-theme_inverse slds-m-right_small">
                                                <lightning-icon icon-name="utility:lock" size="xx-small" variant="inverse" class="slds-m-right_xxx-small"></lightning-icon>
                                                STAGE 1 LOCKED &bull; REVIEW ONLY
                                            </span>
                                            <span class="slds-text-body_small slds-text-color_weak">
                                                Preconditions verified. This stage is locked because the handover process has advanced to <strong>{recordStageName}</strong>. All records and documents are accessible below.
                                            </span>
                                        </div>
                                    </template>

                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium slds-p-bottom_small slds-border_bottom">
                                        <div>
                                            <h2 class="slds-text-heading_small font-weight-bold">Handover Readiness Gate</h2>
                                            <p class="slds-text-body_small slds-text-color_weak">
                                                Commercial, financial, and construction preconditions verified from existing Booking &amp; Project data.
                                            </p>
                                        </div>
                                        <template lwc:if={isReadinessLocked}>
                                            <span class="slds-badge slds-theme_success font-weight-bold">
                                                <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" class="slds-m-right_xx-small"></lightning-icon>
                                                Clearances Passed &amp; Verified
                                            </span>
                                        </template>
                                        <template lwc:else>
                                            <button class="primary-stage-cta" onclick={openStartInspectionModal} disabled={cannotStartInspection}>
                                                START INSPECTION â†’
                                            </button>
                                        </template>
                                    </div>

                                    <!-- 4 Readiness Gate Cards -->
                                    <div class="slds-grid slds-gutters_small slds-wrap slds-m-bottom_medium">
                                        <!-- Tile 1: Booking Clearance -->
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                            <div class="readiness-tile">
                                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                    <span class="readiness-icon-box icon-booking">
                                                        <lightning-icon icon-name="standard:record" size="x-small"></lightning-icon>
                                                    </span>
                                                    <span class="slds-badge slds-theme_success">{readiness.approvalStatus}</span>
                                                </div>
                                                <div class="readiness-tile-title slds-m-top_small">Booking Clearance</div>
                                                <div class="readiness-tile-meta slds-m-top_xx-small">
                                                    Ref: <strong>#{unitSummary.bookingReference}</strong>
                                                </div>
                                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                    Booking confirmed &amp; customer allotment verified.
                                                </p>
                                            </div>
                                        </div>

                                        <!-- Tile 2: Financial Clearance -->
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                            <div class="readiness-tile">
                                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                    <span class="readiness-icon-box icon-finance">
                                                        <lightning-icon icon-name="standard:currency" size="x-small"></lightning-icon>
                                                    </span>
                                                    <span class="slds-badge slds-theme_success">Principal Paid: {readiness.paymentDetails}</span>
                                                </div>
                                                <div class="readiness-tile-title slds-m-top_small">Financial Clearance</div>
                                                <div class="readiness-tile-meta slds-m-top_xx-small">
                                                    Agreement Value: <strong>{unitSummary.finalAmountFormatted}</strong>
                                                </div>
                                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                    All milestones cleared; financial clearance confirmed.
                                                </p>
                                            </div>
                                        </div>

                                        <!-- Tile 3: Occupancy Certificate -->
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                            <div class="readiness-tile">
                                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                    <span class="readiness-icon-box icon-oc">
                                                        <lightning-icon icon-name="standard:task" size="x-small"></lightning-icon>
                                                    </span>
                                                    <span class="slds-badge slds-theme_success">{readiness.ocDetails}</span>
                                                </div>
                                                <div class="readiness-tile-title slds-m-top_small">Occupancy Certificate (OC)</div>
                                                <div class="readiness-tile-meta slds-m-top_xx-small">
                                                    Tower: <strong>{unitSummary.towerName}</strong> &bull; {unitSummary.floorName}
                                                </div>
                                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                    Statutory occupancy clearance received for tower and unit.
                                                </p>
                                            </div>
                                        </div>

                                        <!-- Tile 4: Possession Readiness -->
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                            <div class="readiness-tile">
                                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                    <span class="readiness-icon-box icon-unit">
                                                        <lightning-icon icon-name="standard:home" size="x-small"></lightning-icon>
                                                    </span>
                                                    <span class="slds-badge slds-theme_success">{unitSummary.possessionReadinessStatus}</span>
                                                </div>
                                                <div class="readiness-tile-title slds-m-top_small">Civil Construction Gate</div>
                                                <div class="readiness-tile-meta slds-m-top_xx-small">
                                                    Ready Date: <strong>{readiness.possessionReadyDate}</strong>
                                                </div>
                                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                    Unit civil and architectural finishes marked possession ready.
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </article>
                            </template>

                            <!-- ------------------------------------------------ -->
                            <template lwc:if={isStageInspection}>
                                <article class="slds-card slds-card_boundary slds-p-around_medium stage-card">
                                    <!-- Stage 2 Locked Banner (Review Mode) -->
                                    <template lwc:if={isInspectionLocked}>
                                        <div class="stage-locked-banner slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_medium slds-grid slds-grid_vertical-align-center">
                                            <span class="stage-lock-badge slds-badge slds-theme_inverse slds-m-right_small">
                                                <lightning-icon icon-name="utility:lock" size="xx-small" variant="inverse" class="slds-m-right_xxx-small"></lightning-icon>
                                                STAGE 2 LOCKED &bull; REVIEW ONLY
                                            </span>
                                            <span class="slds-text-body_small slds-text-color_weak">
                                                Inspection completed and locked. Checklist, report and attachments remain accessible for review and download.
                                            </span>
                                        </div>
                                    </template>

                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                        <div>
                                            <h2 class="slds-text-heading_small font-weight-bold">Stage 2: Comprehensive Unit Quality Audit</h2>
                                            <p class="slds-text-body_small slds-text-color_weak">
                                                Inspect architectural, MEP, fixtures and finishes. Marking an issue immediately creates a snag that can be resolved without blocking inspection progress.
                                            </p>
                                        </div>
                                        <div class="slds-grid slds-gutters_x-small slds-grid_vertical-align-center">
                                            <div class="slds-col">
                                                <lightning-button variant="brand-outline" size="small" label="View Report" icon-name="utility:preview" onclick={handlePreviewInspectionReport}></lightning-button>
                                            </div>
                                            <div class="slds-col">
                                                <template lwc:if={isInspectionLocked}>
                                                    <span class="slds-badge slds-theme_success font-weight-bold">
                                                        <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" class="slds-m-right_xx-small"></lightning-icon>
                                                        Inspection Completed &amp; Locked
                                                    </span>
                                                </template>
                                                <template lwc:else>
                                                    <button class="primary-stage-cta" onclick={handleCompleteInspection} disabled={isCompleteInspectionDisabled} title="Complete inspection once all required checklist items are Pass">
                                                        COMPLETE INSPECTION â†’
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                    </div>


                                    <!-- Checklist Summary Strip -->
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small slds-p-around_xx-small slds-theme_shade slds-box slds-box_xx-small">
                                        <span class="metric-pill pill-passed slds-m-right_x-small">âœ“ Passed: <strong>{passedChecklistCount}</strong></span>
                                        <span class="metric-pill pill-issue slds-m-right_x-small">âš  Issues: <strong>{issuesChecklistCount}</strong></span>
                                        <span class="metric-pill pill-na slds-m-right_x-small">â€” N/A: <strong>{naChecklistCount}</strong></span>
                                        <span class={pendingPillClass}>â—‹ Pending: <strong>{pendingChecklistCount}</strong></span>
                                        <span class="slds-col slds-text-align_right slds-text-body_small slds-text-color_weak">{inspectionPercent}% Answered</span>
                                    </div>

                                    <!-- CHECKLIST ITEMS -->
                                    <!-- External Inspection Status Banner (if submitted) -->
                                    <template lwc:if={hasExternalSubmission}>
                                        <div class="external-status-banner slds-box slds-box_xx-small slds-m-bottom_small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                            <div>
                                                <div class="slds-grid slds-grid_vertical-align-center">
                                                    <span class="slds-badge slds-theme_success slds-m-right_x-small">âœ“ External Inspection Submitted</span>
                                                    <span class="slds-text-body_small slds-text-color_weak">By: <strong>{externalInspectorName}</strong> {externalSubmissionDate}</span>
                                                </div>
                                            </div>
                                            <div class="slds-text-body_small">
                                                Passed: <strong>{passedChecklistCount}</strong> &bull; Issues: <strong>{issuesChecklistCount}</strong> &bull; N/A: <strong>{naChecklistCount}</strong>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- ALL CATEGORIES WITH VISIBLE AND ACTIONABLE ROWS -->
                                    <template for:each={checklistGroups} for:item="grp">
                                        <div key={grp.category} class="category-block slds-m-bottom_small">
                                            <div class="category-header slds-p-around_x-small slds-theme_shade slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                <h3 class="slds-text-title_bold font-weight-bold">
                                                    {grp.category}
                                                </h3>
                                                <span class="category-count-badge">{grp.answeredCount} of {grp.totalCount} completed</span>
                                            </div>
                                            <div class="checklist-items-container">
                                                <template for:each={grp.items} for:item="itm">
                                                    <div key={itm.Id} class={itm.rowClass}>
                                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                            <div class="chk-item-main slds-grow slds-m-right_small">
                                                                <div class="slds-grid slds-grid_vertical-align-center">
                                                                    <span class={itm.statusIconClass}>{itm.statusIcon}</span>
                                                                    <strong class="chk-item-title slds-m-right_small">{itm.Name}</strong>

                                                                    <template lwc:if={itm.isPass}>
                                                                        <span class="status-pill pill-pass">âœ“ Passed</span>
                                                                    </template>
                                                                    <template lwc:if={itm.isIssue}>
                                                                        <template lwc:if={itm.hasLinkedSnag}>
                                                                            <span class="status-pill pill-issue-linked">âš  Issue Found &bull; {itm.linkedSnagName}</span>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <span class="status-pill pill-issue">âš  Issue Found</span>
                                                                        </template>
                                                                    </template>
                                                                    <template lwc:if={itm.isNA}>
                                                                        <span class="status-pill pill-na">â€” N/A</span>
                                                                    </template>
                                                                </div>
                                                                <div class="chk-item-meta slds-m-top_xxx-small slds-text-body_small slds-text-color_weak">
                                                                    Location: {itm.Location__c}
                                                                </div>
                                                            </div>

                                                            <div class="chk-item-actions slds-no-flex slds-grid slds-grid_vertical-align-center">
                                                                <div class="slds-button-group chk-btn-group" role="group">
                                                                    <button class={itm.passBtnClass} onclick={handleSetPass} data-id={itm.Id} disabled={isActionDisabled}>
                                                                        {itm.passBtnLabel}
                                                                    </button>
                                                                    <button class={itm.issueBtnClass} onclick={handleSetIssue} data-id={itm.Id} disabled={isActionDisabled}>
                                                                        {itm.issueBtnLabel}
                                                                    </button>
                                                                    <button class={itm.naBtnClass} onclick={handleSetNA} data-id={itm.Id} disabled={isActionDisabled}>
                                                                        {itm.naBtnLabel}
                                                                    </button>
                                                                    <template lwc:if={canEditChecklist}>
                                                                        <lightning-button-icon icon-name="utility:delete" variant="border-filled" size="x-small" onclick={handleDeleteChecklistItem} data-id={itm.Id} title="Remove Line Item" alternative-text="Remove Line Item" class="slds-m-left_x-small"></lightning-button-icon>
                                                                    </template>
                                                            </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                                </div>
                                            </div>
                                        </template>

                                    <!-- STAGE 2: REPORTS & ATTACHED DOCUMENTS -->
                                    <div class="stage-docs-box slds-card slds-card_boundary slds-m-top_medium slds-p-around_small">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <lightning-icon icon-name="doctype:survey" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                <div>
                                                    <h3 class="slds-text-title_bold font-weight-bold">Stage 2 Quality Audit Reports &amp; Files</h3>
                                                    <p class="slds-text-body_small slds-text-color_weak">Official inspection audit report, auditor sign-offs, and quality checklist documentation.</p>
                                                </div>
                                            </div>
                                            <div class="slds-grid slds-gutters_xx-small">
                                                <div class="slds-col">
                                                    <button class="slds-button slds-button_brand-outline slds-button_small" onclick={handlePreviewInspectionReport} title="Preview Inspection Report">
                                                        <lightning-icon icon-name="utility:preview" size="xx-small" class="slds-m-right_xxx-small"></lightning-icon>Preview Report
                                                    </button>
                                                </div>
                                                <div class="slds-col">
                                                    <button class="slds-button slds-button_neutral slds-button_small" onclick={handleDownloadInspectionReport} title="Download Inspection Report">
                                                        <lightning-icon icon-name="utility:download" size="xx-small" class="slds-m-right_xxx-small"></lightning-icon>Download Report
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        <template lwc:if={stageInspectionDocs.length}>
                                            <div class="slds-grid slds-gutters_small slds-wrap">
                                                <template for:each={stageInspectionDocs} for:item="doc">
                                                    <div key={doc.docId} class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                                        <div class="doc-card slds-box slds-box_xx-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                            <div class="slds-grid slds-grid_vertical-align-center slds-truncate">
                                                                <lightning-icon icon-name={doc.iconName} size="small" class="slds-m-right_x-small"></lightning-icon>
                                                                <div class="slds-truncate">
                                                                    <div class="slds-text-body_small font-weight-bold slds-truncate" title={doc.title}>{doc.title}</div>
                                                                    <div class="slds-text-body_small slds-text-color_weak">{doc.fileType} &bull; {doc.createdDate}</div>
                                                                </div>
                                                            </div>
                                                            <div class="slds-button-group slds-no-flex" role="group">
                                                                <button class="slds-button slds-button_icon slds-button_icon-border slds-button_icon-small" title="View / Preview Document" onclick={handlePreviewDocument} data-id={doc.docId}>
                                                                    <lightning-icon icon-name="utility:preview" size="xx-small"></lightning-icon>
                                                                </button>
                                                                <button class="slds-button slds-button_icon slds-button_icon-border slds-button_icon-small slds-m-left_xx-small" title="Download Document" onclick={handleDownloadDocument} data-id={doc.docId}>
                                                                    <lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div class="slds-box slds-box_xx-small slds-theme_shade slds-text-align_center slds-p-around_small">
                                                <p class="slds-text-body_small slds-text-color_weak">
                                                    Click <strong>Preview Report</strong> or <strong>Download Report</strong> above to generate and access the official quality audit documentation anytime.
                                                </p>
                                            </div>
                                        </template>
                                    </div>
                                </article>
                            </template>

                            <!-- ------------------------------------------------ -->
                            <template lwc:if={isStageResolution}>
                                <article class="slds-card slds-card_boundary slds-p-around_medium stage-card">
                                    <!-- Stage 3 Locked Banner (Review Mode) -->
                                    <template lwc:if={isResolutionLocked}>
                                        <div class="stage-locked-banner slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_medium slds-grid slds-grid_vertical-align-center">
                                            <span class="stage-lock-badge slds-badge slds-theme_inverse slds-m-right_small">
                                                <lightning-icon icon-name="utility:lock" size="xx-small" variant="inverse" class="slds-m-right_xxx-small"></lightning-icon>
                                                STAGE 3 LOCKED &bull; REVIEW ONLY
                                            </span>
                                            <span class="slds-text-body_small slds-text-color_weak">
                                                Snag rectification verified and closed. All defect history and evidence photos are accessible for review.
                                            </span>
                                        </div>
                                    </template>

                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                        <div>
                                            <h2 class="slds-text-heading_small font-weight-bold">Stage 3: Snag &amp; Defect Rectification</h2>
                                            <p class="slds-text-body_small slds-text-color_weak">
                                                Track snags from identification to owner assignment, rectification evidence, verification, and closure.
                                            </p>
                                        </div>
                                        <div class="slds-grid slds-gutters_x-small slds-grid_vertical-align-center">
                                            <div class="slds-col">
                                                <template lwc:if={isResolutionLocked}>
                                                    <span class="slds-badge slds-theme_success font-weight-bold">
                                                        <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" class="slds-m-right_xx-small"></lightning-icon>
                                                        Rectifications Verified &amp; Closed
                                                    </span>
                                                </template>
                                                <template lwc:else>
                                                    <button class="primary-stage-cta" onclick={handleProceedToAppointment} disabled={isContinueToAppointmentDisabled}>
                                                        CONTINUE TO APPOINTMENT â†’
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                    </div>

                                    <template lwc:if={hasUnresolvedSnags}>
                                        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                                            <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                            <span>Cannot advance to Appointment while required snags are unresolved or unverified ({unresolvedSnagsCount} pending).</span>
                                        </div>
                                    </template>

                                    <!-- Top Snag Metrics Strip -->
                                    <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                                        <div class="slds-col slds-size_1-of-5">
                                            <div class="metric-tile">
                                                <div class="metric-label">TOTAL SNAGS</div>
                                                <div class="metric-val">{snagBoard.totalCount}</div>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-5">
                                            <div class="metric-tile">
                                                <div class="metric-label">OPEN</div>
                                                <div class="metric-val" style="color: #ea580c;">{snagBoard.openCount}</div>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-5">
                                            <div class="metric-tile">
                                                <div class="metric-label">IN PROGRESS</div>
                                                <div class="metric-val" style="color: #d97706;">{snagBoard.inProgressCount}</div>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-5">
                                            <div class="metric-tile">
                                                <div class="metric-label">VERIFICATION</div>
                                                <div class="metric-val" style="color: #2563eb;">{snagBoard.verificationCount}</div>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-5">
                                            <div class="metric-tile">
                                                <div class="metric-label">CLOSED</div>
                                                <div class="metric-val" style="color: #059669;">{snagBoard.closedCount}</div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 4-Column Kanban Board -->
                                    <div class="kanban-grid">
                                        <!-- Column 1: OPEN -->
                                        <div class="kanban-col">
                                            <div class="kanban-header">
                                                <span>1. OPEN</span>
                                                <span class="slds-badge slds-badge_lightest">{snagBoard.openCount}</span>
                                            </div>
                                            <template for:each={snagBoard.openSnags} for:item="s">
                                                <div key={s.Id} class={s.cardClass}>
                                                    <div class="slds-grid slds-grid_align-spread">
                                                        <strong class="slds-text-body_small">{s.Name}</strong>
                                                        <span class={s.severityBadgeClass}>{s.Severity__c}</span>
                                                    </div>
                                                    <div class="slds-text-title_bold slds-m-top_xx-small">{s.Location__c} &bull; {s.Category__c}</div>
                                                    <p class="slds-text-body_small slds-m-top_xx-small">{s.Snag_Description__c}</p>
                                                    <template lwc:if={s.Responsible_Team__c}>
                                                        <div class="slds-text-body_small slds-m-top_xxx-small font-weight-bold" style="color: #0b2345;">
                                                            Team: {s.Responsible_Team__c}
                                                        </div>
                                                    </template>
                                                    <div class="slds-text-body_small slds-m-top_xx-small slds-text-color_weak">
                                                        Due: {s.Due_Date__c}
                                                    </div>
                                                    <template lwc:if={s.Rejection_Reason__c}>
                                                        <div class="slds-box slds-box_xx-small slds-m-top_xx-small slds-text-body_small" style="background:#fee2e2; border-color:#fca5a5; color:#991b1b;">
                                                            Rejection Reason: <em>{s.Rejection_Reason__c}</em>
                                                        </div>
                                                    </template>
                                                    <template lwc:if={isNotResolutionLocked}>
                                                        <div class="slds-m-top_x-small slds-text-align_right">
                                                            <lightning-button size="x-small" variant="brand-outline" label="Assign Owner &amp; Team" onclick={handleOpenAssignModal} data-id={s.Id}></lightning-button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Column 2: IN PROGRESS -->
                                        <div class="kanban-col">
                                            <div class="kanban-header">
                                                <span>2. IN PROGRESS</span>
                                                <span class="slds-badge slds-badge_lightest">{snagBoard.inProgressCount}</span>
                                            </div>
                                            <template for:each={snagBoard.inProgressSnags} for:item="s">
                                                <div key={s.Id} class={s.cardClass}>
                                                    <div class="slds-grid slds-grid_align-spread">
                                                        <strong class="slds-text-body_small">{s.Name}</strong>
                                                        <span class={s.severityBadgeClass}>{s.Severity__c}</span>
                                                    </div>
                                                    <div class="slds-text-title_bold slds-m-top_xx-small">{s.Location__c} &bull; {s.Category__c}</div>
                                                    <p class="slds-text-body_small slds-m-top_xx-small">{s.Snag_Description__c}</p>
                                                    <div class="slds-text-body_small slds-m-top_xx-small font-weight-bold" style="color: #0b2345;">
                                                        Assigned: {s.Assigned_Contractor_Name__c}
                                                        <template lwc:if={s.Responsible_Team__c}>
                                                            <span> &bull; {s.Responsible_Team__c}</span>
                                                        </template>
                                                    </div>
                                                    <template lwc:if={isNotResolutionLocked}>
                                                        <div class="slds-m-top_x-small slds-text-align_right">
                                                            <lightning-button size="x-small" variant="brand" label="Resolve &amp; Upload Evidence" onclick={openResolveModal} data-id={s.Id}></lightning-button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Column 3: VERIFICATION -->
                                        <div class="kanban-col">
                                            <div class="kanban-header">
                                                <span>3. VERIFICATION</span>
                                                <span class="slds-badge slds-badge_lightest">{snagBoard.verificationCount}</span>
                                            </div>
                                            <template for:each={snagBoard.verificationSnags} for:item="s">
                                                <div key={s.Id} class={s.cardClass}>
                                                    <div class="slds-grid slds-grid_align-spread">
                                                        <strong class="slds-text-body_small">{s.Name}</strong>
                                                        <span class={s.severityBadgeClass}>{s.Severity__c}</span>
                                                    </div>
                                                    <div class="slds-text-title_bold slds-m-top_xx-small">{s.Location__c} &bull; {s.Category__c}</div>
                                                    <p class="slds-text-body_small slds-m-top_xx-small">{s.Snag_Description__c}</p>
                                                    <template lwc:if={s.Resolution_Comments__c}>
                                                        <div class="slds-box slds-box_xx-small slds-m-top_xx-small slds-text-body_small" style="background:#eff6ff; border-color:#bfdbfe; color:#1e40af;">
                                                            <strong>Remarks:</strong> {s.Resolution_Comments__c}
                                                        </div>
                                                    </template>
                                                    <template lwc:if={s.evidenceFiles.length}>
                                                        <div class="slds-m-top_xx-small">
                                                            <strong class="slds-text-body_small" style="font-size: 0.72rem; color: #1e3a8a;">Evidence Files ({s.evidenceFiles.length}):</strong>
                                                            <template for:each={s.evidenceFiles} for:item="ef">
                                                                <div key={ef.documentId} class="slds-m-top_xxx-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                                    <span class="slds-text-body_small slds-truncate" title={ef.title}>
                                                                        <lightning-icon icon-name="doctype:image" size="xx-small" class="slds-m-right_xxx-small"></lightning-icon>
                                                                        {ef.title}
                                                                    </span>
                                                                    <div class="slds-button-group slds-no-flex" role="group">
                                                                        <button class="slds-button slds-button_icon slds-button_icon-border slds-button_icon-x-small" title="Preview Evidence" onclick={handlePreviewDocument} data-id={ef.documentId}>
                                                                            <lightning-icon icon-name="utility:preview" size="xx-small"></lightning-icon>
                                                                        </button>
                                                                        <button class="slds-button slds-button_icon slds-button_icon-border slds-button_icon-x-small slds-m-left_xxx-small" title="Download Evidence" onclick={handleDownloadDocument} data-id={ef.documentId}>
                                                                            <lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                    <template lwc:if={isNotResolutionLocked}>
                                                        <div class="slds-grid slds-gutters_xx-small slds-m-top_x-small">
                                                            <div class="slds-col slds-size_1-of-2">
                                                                <lightning-button size="x-small" variant="success" label="âœ“ Approve" onclick={handleApproveSnag} data-id={s.Id} class="slds-button_stretch"></lightning-button>
                                                            </div>
                                                            <div class="slds-col slds-size_1-of-2">
                                                                <lightning-button size="x-small" variant="destructive-text" label="âœ— Reject" onclick={handleOpenReopenModal} data-id={s.Id} class="slds-button_stretch"></lightning-button>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Column 4: CLOSED -->
                                        <div class="kanban-col">
                                            <div class="kanban-header">
                                                <span>4. CLOSED</span>
                                                <span class="slds-badge slds-theme_success">{snagBoard.closedCount}</span>
                                            </div>
                                            <template for:each={snagBoard.closedSnags} for:item="s">
                                                <div key={s.Id} class={s.cardClass}>
                                                    <div class="slds-grid slds-grid_align-spread">
                                                        <strong class="slds-text-body_small">{s.Name}</strong>
                                                        <lightning-icon icon-name="utility:check" size="xx-small" variant="success"></lightning-icon>
                                                    </div>
                                                    <div class="slds-text-body_small slds-m-top_xx-small">{s.Location__c} &bull; {s.Snag_Description__c}</div>
                                                    <div class="slds-text-body_small slds-m-top_xx-small" style="color: #059669;">Verified &amp; Rectified &bull; Item Passed</div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- STAGE 3: REPORTS & ATTACHED DOCUMENTS -->
                                    <div class="stage-docs-box slds-card slds-card_boundary slds-m-top_medium slds-p-around_small">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <lightning-icon icon-name="doctype:image" size="small" class="slds-m-right_x-small"></lightning-icon>
                                                <div>
                                                    <h3 class="slds-text-title_bold font-weight-bold">Stage 3 Defect Evidence &amp; Rectification Records</h3>
                                                    <p class="slds-text-body_small slds-text-color_weak">Photographic defect evidence, contractor rectification logs, and verification sign-offs.</p>
                                                </div>
                                            </div>
                                            <span class="slds-badge slds-badge_lightest">{stageResolutionDocsCount} Document(s)</span>
                                        </div>

                                        <template lwc:if={stageResolutionDocs.length}>
                                            <div class="slds-grid slds-gutters_small slds-wrap">
                                                <template for:each={stageResolutionDocs} for:item="doc">
                                                    <div key={doc.docId} class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                                        <div class="doc-card slds-box slds-box_xx-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                            <div class="slds-grid slds-grid_vertical-align-center slds-truncate">
                                                                <lightning-icon icon-name={doc.iconName} size="small" class="slds-m-right_x-small"></lightning-icon>
                                                                <div class="slds-truncate">
                                                                    <div class="slds-text-body_small font-weight-bold slds-truncate" title={doc.title}>{doc.title}</div>
                                                                    <div class="slds-text-body_small slds-text-color_weak">{doc.fileType} &bull; {doc.createdDate}</div>
                                                                </div>
                                                            </div>
                                                            <div class="slds-button-group slds-no-flex" role="group">
                                                                <button class="slds-button slds-button_icon slds-button_icon-border slds-button_icon-small" title="View / Preview Document" onclick={handlePreviewDocument} data-id={doc.docId}>
                                                                    <lightning-icon icon-name="utility:preview" size="xx-small"></lightning-icon>
                                                                </button>
                                                                <button class="slds-button slds-button_icon slds-button_icon-border slds-button_icon-small slds-m-left_xx-small" title="Download Document" onclick={handleDownloadDocument} data-id={doc.docId}>
                                                                    <lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div class="slds-box slds-box_xx-small slds-theme_shade slds-text-align_center slds-p-around_small">
                                                <p class="slds-text-body_small slds-text-color_weak">
                                                    All photographic evidence files uploaded against snags and defects are accessible with View and Download above and in the Related Records tab.
                                                </p>
                                            </div>
                                        </template>
                                    </div>
                                </article>
                            </template>

                            <!-- ------------------------------------------------ -->
                            <template lwc:if={isStageAppointment}>
                                <article class="slds-card slds-card_boundary slds-p-around_medium stage-card">
                                    <!-- Stage 4 Locked Banner (Review Mode) -->
                                    <template lwc:if={isAppointmentLocked}>
                                        <div class="stage-locked-banner slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_medium slds-grid slds-grid_vertical-align-center">
                                            <span class="stage-lock-badge slds-badge slds-theme_inverse slds-m-right_small">
                                                <lightning-icon icon-name="utility:lock" size="xx-small" variant="inverse" class="slds-m-right_xxx-small"></lightning-icon>
                                                STAGE 4 LOCKED &bull; REVIEW ONLY
                                            </span>
                                            <span class="slds-text-body_small slds-text-color_weak">
                                                Physical possession formally executed. All handover records, documents and signed acknowledgements are accessible for review and download.
                                            </span>
                                        </div>
                                    </template>

                                    <!-- 1. Appointment & Invitation -->
                                    <div class="appointment-section slds-m-bottom_large">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div>
                                                <h3 class="slds-text-title_bold font-weight-bold" style="font-size: 0.9375rem;">
                                                    Appointment Scheduling
                                                </h3>
                                                <p class="slds-text-body_small slds-text-color_weak">
                                                    Schedule possession appointment and dispatch customer calendar invitation.
                                                </p>
                                            </div>
                                            <template lwc:if={isAppointmentScheduled}>
                                                <span class="slds-badge slds-theme_success font-weight-bold">Appointment Scheduled</span>
                                            </template>
                                        </div>

                                        <div class="slds-grid slds-gutters_small slds-wrap slds-m-bottom_small">
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                                <lightning-input type="date" label="Appointment Date" value={aptDate} onchange={handleAptDateChange} class="slds-m-bottom_x-small" disabled={isAppointmentReadOnly} required></lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                                <lightning-combobox label="Time Slot" value={aptSlot} options={timeSlotOptions} onchange={handleAptSlotChange} class="slds-m-bottom_x-small" disabled={isAppointmentReadOnly} required></lightning-combobox>
                                            </div>
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                                <lightning-input type="text" label="Location" value={aptLocation} onchange={handleAptLocationChange} class="slds-m-bottom_x-small" disabled={isAppointmentReadOnly} required></lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                                <lightning-input type="text" label="Handover Owner" value={handoverOwnerName} class="slds-m-bottom_x-small" readonly></lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                                <lightning-input type="text" label="Customer" value={customerName} class="slds-m-bottom_x-small" readonly></lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                                <lightning-input type="email" label="Customer Email" value={customerEmail} class="slds-m-bottom_x-small" readonly></lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_1-of-1">
                                                <lightning-textarea label="Customer Instructions / Notes" value={aptInstructions} onchange={handleAptInstructionsChange} class="slds-m-bottom_x-small" disabled={isAppointmentReadOnly}></lightning-textarea>
                                            </div>
                                        </div>

                                        <!-- Appointment Action Controls: Hides "Send Customer Invite" when scheduled -->
                                        <div class="slds-grid slds-gutters_x-small">
                                            <template lwc:if={isNotAppointmentLocked}>
                                                <template lwc:if={isNotCompleted}>
                                                    <template lwc:if={isAppointmentScheduled}>
                                                        <div class="slds-col">
                                                            <lightning-button variant="brand" label="Reschedule Appointment" icon-name="utility:change_record_type" onclick={openRescheduleModal}></lightning-button>
                                                        </div>
                                                    </template>
                                                    <template lwc:else>
                                                        <div class="slds-col">
                                                            <button class="primary-stage-cta" onclick={handleSendCustomerInvite} disabled={isLoading}>
                                                                SEND CUSTOMER INVITE â†’
                                                            </button>
                                                        </div>
                                                    </template>
                                                </template>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- 2. Physical Handover Protocol (Sections A, B, C) -->
                                    <div class="handover-completion-section slds-border_top slds-p-top_medium">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div>
                                                <h3 class="slds-text-title_bold font-weight-bold" style="font-size: 0.95rem; color: #0b2345;">
                                                    PHYSICAL HANDOVER PROTOCOL
                                                </h3>
                                                <p class="slds-text-body_small slds-text-color_weak">
                                                    Mandatory possession handover checklist. Complete Sections A, B, and C to enable handover completion.
                                                </p>
                                            </div>
                                            <template lwc:if={isAllHandoverSectionsComplete}>
                                                <span class="slds-badge slds-theme_success font-weight-bold">âœ“ Ready for Completion</span>
                                            </template>
                                            <template lwc:else>
                                                <span class="slds-badge slds-badge_lightest font-weight-bold">Checklist Incomplete</span>
                                            </template>
                                        </div>

                                        <!-- SECTION A: KEYS & ACCESS -->
                                        <div class="handover-section-box slds-box slds-box_small slds-m-bottom_medium">
                                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                                                <h4 class="slds-text-title_bold font-weight-bold" style="color: #0b2345;">
                                                    Section A: Keys &amp; Access Controls
                                                </h4>
                                                <span class={sectionABadgeClass}>{sectionABadgeLabel}</span>
                                            </div>
                                            <div class="slds-grid slds-gutters_small slds-wrap">
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                                    <div class="slds-box slds-box_xx-small slds-theme_shade">
                                                        <lightning-input type="checkbox" label="Physical Key Sets Handed Over" checked={keysHandedOver} onchange={handleKeysHandedOverChange} disabled={isAppointmentReadOnly}></lightning-input>
                                                        <div class="slds-m-top_xx-small slds-p-left_medium">
                                                            <lightning-input type="number" label="Number of Key Sets" value={keysSetsCount} onchange={handleKeysSetsCountChange} min="1" max="10" disabled={isAppointmentReadOnly}></lightning-input>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                                    <div class="slds-box slds-box_xx-small slds-theme_shade">
                                                        <lightning-input type="checkbox" label="Access Cards Handed Over" checked={cardsHandedOver} onchange={handleCardsHandedOverChange} disabled={isAppointmentReadOnly}></lightning-input>
                                                        <div class="slds-m-top_xx-small slds-p-left_medium">
                                                            <lightning-input type="number" label="Number of Access Cards" value={accessCardsCount} onchange={handleAccessCardsCountChange} min="1" max="10" disabled={isAppointmentReadOnly}></lightning-input>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- SECTION B: DOCUMENT HANDOVER -->
                                        <div class="handover-section-box slds-box slds-box_small slds-m-bottom_medium">
                                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                                                <h4 class="slds-text-title_bold font-weight-bold" style="color: #0b2345;">
                                                    Section B: Document Handover
                                                </h4>
                                                <span class={sectionBBadgeClass}>{sectionBBadgeLabel}</span>
                                            </div>
                                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                                                Upload relevant handover documents: Occupancy Certificate copy, Warranty Documents &amp; Appliance Manuals, As-Built Drawings.
                                            </p>
                                            <div class="slds-m-bottom_small">
                                                <lightning-input type="checkbox" label="Required Handover Documents Handed Over to Customer" checked={docsHandedOver} onchange={handleDocsHandedOverChange} disabled={isAppointmentReadOnly}></lightning-input>
                                            </div>
                                            <template lwc:if={isNotAppointmentLocked}>
                                                <div class="slds-box slds-box_xx-small slds-theme_shade">
                                                    <lightning-file-upload
                                                        label="Upload Supporting Handover Documents (Certificates, Receipts, Manuals)"
                                                        name="handoverDocsUploader"
                                                        record-id={handover.Id}
                                                        onuploadfinished={handleHandoverDocUploadFinished}
                                                        multiple>
                                                    </lightning-file-upload>
                                                </div>
                                            </template>
                                            <template lwc:if={uploadedHandoverDocFiles.length}>
                                                <div class="slds-m-top_x-small slds-p-around_x-small slds-theme_shade slds-box slds-box_xx-small">
                                                    <strong class="slds-text-body_small">Possession Documents Uploaded ({uploadedHandoverDocFiles.length}):</strong>
                                                    <template for:each={uploadedHandoverDocFiles} for:item="f">

                                                        <div class="doc-card slds-box slds-box_xx-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                            <div class="slds-grid slds-grid_vertical-align-center slds-truncate">
                                                                <lightning-icon icon-name={doc.iconName} size="small" class="slds-m-right_x-small"></lightning-icon>

                                                                    <div class="slds-text-body_small font-weight-bold slds-truncate" title={doc.title}>{doc.title}</div>

                                                                </div>
                                                            </div>
                                                            <div class="slds-button-group slds-no-flex" role="group">
                                                                <button class="slds-button slds-button_icon slds-button_icon-border slds-button_icon-small" title="View / Preview Document" onclick={handlePreviewDocument} data-id={doc.docId}>

                                                                </button>
                                                                <button class="slds-button slds-button_icon slds-button_icon-border slds-button_icon-small slds-m-left_xx-small" title="Download Document" onclick={handleDownloadDocument} data-id={doc.docId}>
                                                                    <lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>

                                                        </div>
                                                    </div>
                                                </template>

                                        </template>
                                        <template lwc:else>

                                                <p class="slds-text-body_small slds-text-color_weak">

                                    <!-- STAGE 5: HISTORICAL STAGES REVIEW GRID -->

                                                <div class="stage-nav-tile slds-box slds-box_xx-small slds-theme_shade slds-text-align_center">

                                                    <lightning-button variant="neutral" label="Review Stage" onclick={handleSelectStage} data-stage="Inspection" size="small" icon-name="utility:lock"></lightning-button>
