                                    </div>
                                    <template lwc:if={customerPhone}>
                                        <div class="slds-text-body_small">
                                            <lightning-icon icon-name="utility:call" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                            <a href={customerPhoneHref}>{customerPhone}</a>
                                        </div>
                                    </template>
                                </div>

                                <template lwc:if={hasCoOwners}>
                                    <div class="slds-text-title_caps font-weight-bold slds-m-bottom_xx-small slds-text-color_weak">
                                        Co-Applicants / Co-Owners ({coOwnersCount})
                                    </div>
                                    <div class="co-owners-list slds-m-bottom_small">
                                        <template for:each={coOwners} for:item="co">
                                            <div key={co.name} class="slds-box slds-box_xx-small slds-m-bottom_xx-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                <div>
                                                    <strong class="slds-text-body_small">{co.name}</strong>
                                                    <div class="slds-text-body_small slds-text-color_weak">{co.email}</div>
                                                </div>
                                                <span class="slds-badge slds-badge_lightest">{co.role}</span>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Modal 1: Start Inspection Modal -->
        <template lwc:if={showStartInspectionModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeStartInspectionModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate font-weight-bold">Initiate Unit Inspection</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox label="Audit Type" value={inspectionType} options={inspectionTypeOptions} onchange={handleInspectionTypeChange} class="slds-m-bottom_small" required></lightning-combobox>
                        <lightning-input type="text" label="Lead Inspector Name" value={inspectorName} onchange={handleInspectorNameChange} class="slds-m-bottom_small" required></lightning-input>
                        <lightning-input type="text" label="Inspection Agency / Department" value={inspectorCompany} onchange={handleInspectorCompanyChange} class="slds-m-bottom_small"></lightning-input>
                        <lightning-input type="email" label="Inspector Email" value={inspectorEmail} onchange={handleInspectorEmailChange} class="slds-m-bottom_small"></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeStartInspectionModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="brand" label="Start Inspection" onclick={handleConfirmStartInspection}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Modal 2: Raise Snag Modal -->
        <template lwc:if={showRaiseSnagModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeRaiseSnagModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate font-weight-bold">Raise Snag / Defect</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox label="Location / Area" value={newSnagLocation} options={locationOptions} onchange={handleSnagLocationChange} class="slds-m-bottom_small" required></lightning-combobox>
                        <lightning-combobox label="Category" value={newSnagCategory} options={categoryOptions} onchange={handleSnagCategoryChange} class="slds-m-bottom_small" required></lightning-combobox>
                        <lightning-combobox label="Responsible Team" value={newSnagTeam} options={teamOptions} onchange={handleSnagTeamChange} class="slds-m-bottom_small" required></lightning-combobox>
                        <lightning-textarea label="Snag Description" value={newSnagDesc} onchange={handleSnagDescChange} class="slds-m-bottom_small" required></lightning-textarea>
                        <lightning-combobox label="Severity" value={newSnagSeverity} options={severityOptions} onchange={handleSnagSeverityChange} class="slds-m-bottom_small" required></lightning-combobox>
                        <lightning-combobox label="Assign Supervisor / Lead" value={newSnagContractor} options={contractorOptions} onchange={handleSnagContractorChange} class="slds-m-bottom_small"></lightning-combobox>
                        <lightning-input type="date" label="Resolution Due Date" value={newSnagDueDate} onchange={handleSnagDueDateChange} class="slds-m-bottom_small"></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeRaiseSnagModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="brand" label="Raise Snag" onclick={handleSaveSnag}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Modal 3: Assign Owner & Team Modal -->
        <template lwc:if={showAssignModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeAssignModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate font-weight-bold">Assign Snag Supervisor &amp; Responsible Team</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox label="Primary Owner / Supervisor" value={selectedContractor} options={contractorOptions} onchange={handleContractorSelectChange} required class="slds-m-bottom_small"></lightning-combobox>
                        <lightning-combobox label="Responsible Team" value={selectedResponsibleTeam} options={teamOptions} onchange={handleResponsibleTeamChange} required class="slds-m-bottom_small"></lightning-combobox>
                        <lightning-textarea label="Assignment Instructions / SLA Remarks" value={assignmentRemarks} onchange={handleAssignmentRemarksChange} class="slds-m-bottom_small" placeholder="Enter work instructions or SLA for this team..."></lightning-textarea>
                        
                        <template lwc:if={currentSnagExternalToken}>
                            <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-top_x-small">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div>
                                        <strong class="slds-text-body_small">External Resolver Link</strong>
                                        <div class="slds-text-body_small slds-text-color_weak">Token: {currentSnagExternalToken}</div>
                                    </div>
                                    <lightning-button size="x-small" variant="neutral" label="Copy Link" icon-name="utility:copy" onclick={handleCopySnagExternalLink}></lightning-button>
                                </div>
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeAssignModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="brand" label="Save Assignment" onclick={handleSaveAssignContractor}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Modal 4: Reject Snag Modal -->
        <template lwc:if={showReopenModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeReopenModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate font-weight-bold">Reject Snag Verification</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-textarea label="Rejection Reason &amp; Required Rework" value={reopenReason} onchange={handleReopenReasonChange} required placeholder="Detail specific defects remaining or why rework is required..."></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeReopenModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="destructive" label="Reject &amp; Reopen Snag" onclick={handleSaveReopenSnag}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Modal 5: Reschedule Appointment Modal -->
        <template lwc:if={showRescheduleModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeRescheduleModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate font-weight-bold">Reschedule Handover Appointment</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input type="date" label="New Appointment Date" value={rescheduleDate} onchange={handleRescheduleDateChange} class="slds-m-bottom_small" required></lightning-input>
                        <lightning-combobox label="New Time Slot" value={rescheduleSlot} options={timeSlotOptions} onchange={handleRescheduleSlotChange} class="slds-m-bottom_small" required></lightning-combobox>
                        <lightning-input type="text" label="Location" value={rescheduleLocation} onchange={handleRescheduleLocationChange} class="slds-m-bottom_small" required></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeRescheduleModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="brand" label="Reschedule &amp; Notify Customer" onclick={handleSaveRescheduleAppointment}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Modal 6: Edit Target Handover Date Modal -->
        <template lwc:if={showEditTargetDateModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeEditTargetDateModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate font-weight-bold">Update Target Handover Date</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input type="date" label="Target Handover Date" value={targetDateVal} onchange={handleTargetDateChange} required></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeEditTargetDateModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="brand" label="Save Target Date" onclick={handleSaveTargetDate}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Modal 7: Change Handover Owner Modal -->
        <template lwc:if={showChangeOwnerModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeChangeOwnerModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate font-weight-bold">Change Handover Owner</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input type="search" label="Search Active Users" value={ownerSearchTerm} onchange={handleOwnerSearchChange} placeholder="Type name or email to search..." class="slds-m-bottom_small"></lightning-input>
                        <template lwc:if={searchedUsers.length}>
                            <div class="slds-box slds-box_xx-small user-select-list slds-m-bottom_small">
                                <template for:each={searchedUsers} for:item="u">
                                    <div key={u.Id} class="user-select-row slds-p-around_x-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center" onclick={handleSelectNewOwner} data-id={u.Id} data-name={u.Name}>
                                        <div>
                                            <div class="font-weight-bold">{u.Name}</div>
                                            <div class="slds-text-body_small slds-text-color_weak">{u.Email} &bull; {u.Title}</div>
                                        </div>
                                        <template lwc:if={u.isSelected}>
                                            <span class="slds-badge slds-theme_success">Selected</span>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={selectedNewOwnerName}>
                            <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-top_x-small">
                                Selected Owner: <strong>{selectedNewOwnerName}</strong>
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeChangeOwnerModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="brand" label="Update Owner" onclick={handleSaveChangeOwner} disabled={isChangeOwnerSaveDisabled}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Modal 8: Add Checklist Item Modal -->
        <template lwc:if={showAddChecklistItemModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeAddChecklistItemModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate font-weight-bold">Add Inspection Line Item</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input type="text" label="Line Item Name / Inspection Check" value={newItemName} onchange={handleNewItemNameChange} required class="slds-m-bottom_small" placeholder="e.g. Electrical Socket Earthing &amp; Polarity"></lightning-input>
                        <lightning-combobox label="Category" value={newItemCategory} options={categoryOptions} onchange={handleNewItemCategoryChange} required class="slds-m-bottom_small"></lightning-combobox>
                        <lightning-combobox label="Location" value={newItemLocation} options={locationOptions} onchange={handleNewItemLocationChange} required class="slds-m-bottom_small"></lightning-combobox>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeAddChecklistItemModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="brand" label="Add Line Item" onclick={handleSaveChecklistItem} disabled={isSaveNewItemDisabled}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Modal 9: Submit Snag for Verification (Actual File Upload via Salesforce Files) -->
        <template lwc:if={showResolveSnagModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeResolveModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate font-weight-bold">Submit Snag for Verification &amp; Approval</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-body_small slds-m-bottom_small">
                            Upload rectification photo/video evidence directly into Salesforce Files and enter work remarks:
                        </p>
                        
                        <!-- Actual File Upload -->
                        <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_small">
                            <label class="slds-form-element__label font-weight-bold">Rectification Evidence (Photos / Videos)</label>
                            <lightning-file-upload
                                label="Upload Evidence Files"
                                name="snagEvidenceUploader"
                                accept=".png,.jpg,.jpeg,.mp4,.mov,.pdf"
                                record-id={selectedSnagId}
                                onuploadfinished={handleSnagUploadFinished}
                                multiple>
                            </lightning-file-upload>
                            <template lwc:if={selectedSnagFiles.length}>
                                <div class="slds-m-top_x-small">
                                    <strong class="slds-text-body_small">Attached Evidence Files ({selectedSnagFiles.length}):</strong>
                                    <ul class="slds-list_dotted slds-m-top_xx-small">
                                        <template for:each={selectedSnagFiles} for:item="f">
                                            <li key={f.documentId}>
                                                <a href={f.downloadUrl} target="_blank" class="slds-text-link">
                                                    <lightning-icon icon-name="doctype:image" size="xx-small" class="slds-m-right_xxx-small"></lightning-icon>
                                                    {f.title} ({f.fileType}) â†—
                                                </a>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                        </div>

                        <lightning-textarea label="Rectification Remarks / Work Details" value={resolutionComments} onchange={handleResolutionCommentsChange} required class="slds-m-bottom_small" placeholder="e.g. Wall skirting repointed, polished, and touch-up paint applied. Ready for verification."></lightning-textarea>

                        <div class="slds-text-body_small slds-text-color_weak">
                            Submitting will notify the Approver ({handoverOwnerName}) to perform verification sign-off.
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeResolveModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="brand" label="Submit for Verification" onclick={handleSaveResolveSnag}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Modal 10: External Inspection Form Modal -->
        <template lwc:if={showExternalFormModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeExternalFormModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate font-weight-bold">External Auditor Inspection Form</h2>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xxx-small">Third-Party Independent Audit Portal &bull; Unit: {unitName} &bull; Token: {currentInspectionToken}</p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input type="text" label="Auditor Name" value={externalAuditorName} onchange={handleExtAuditorNameChange} required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input type="text" label="Auditing Agency / Company" value={externalAuditorCompany} onchange={handleExtAuditorCompanyChange} required></lightning-input>
                            </div>
                        </div>
                        <lightning-textarea label="Overall Audit Summary &amp; Recommendations" value={externalOverallComments} onchange={handleExtCommentsChange} class="slds-m-bottom_medium" placeholder="Enter high-level findings..."></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeExternalFormModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="brand" label="Submit External Audit" onclick={handleSubmitExternalInspectionForm}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>


        <!-- Modal 12: View All Related Records Modal -->
        <template lwc:if={showViewAllModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <lightning-icon icon-name={viewAllConfig.icon} size="small" class="slds-m-right_x-small"></lightning-icon>
                            <div class="slds-text-align_left">
                                <h2 class="slds-modal__title slds-hyphenate font-weight-bold">{viewAllConfig.title}</h2>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xxx-small">Showing {viewAllTotalCount} record(s) &bull; Click record name to view details</p>
                            </div>
                        </div>
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeViewAllModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                            <div class="slds-size_4-of-12">
                                <lightning-input type="search" placeholder="Filter records..." onchange={handleViewAllFilter} variant="label-hidden"></lightning-input>
                            </div>
                        </div>

                        <div class="view-all-table-container">
                            <!-- Inspections -->
                            <template lwc:if={isViewAllInspections}>
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered responsive-related-table">
                                    <thead>
                                        <tr class="slds-line-height_reset">

                    </button>
                    <h2 id="formalReportModalHeading" class="slds-text-heading_medium slds-hyphenate">
                        <lightning-icon icon-name="doctype:survey" size="small" class="slds-m-right_x-small" variant="inverse"></lightning-icon>

                                    <div class="slds-text-body_small font-weight-bold">{formalReportData.inspection.status}</div>
                                </div>

                                    </thead>

                                                    <template lwc:else>

                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>

                            </div>
                        </template>

                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>

                <div class="slds-modal__content slds-p-around_medium">

                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 id="shareSnagModalHeading" class="slds-text-heading_medium">Share Snag with External Team Member</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                        Share this snag with a contractor or external person without creating duplicate records. They will receive a secure link to view details.
                    </p>
                    <lightning-input type="email" label="Recipient Email" value={shareSnagEmail} onchange={handleShareSnagEmailChange} placeholder="contractor@company.com" required></lightning-input>
                    <lightning-textarea label="Message / Note" value={shareSnagNote} onchange={handleShareSnagNoteChange} max-length="500" class="slds-m-top_small" placeholder="Add any special instructions or context..."></lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCloseShareSnagModal}></lightning-button>
                    <lightning-button variant="brand" label="Share Snag" icon-name="utility:share" onclick={handleShareSnag}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

</template>
