<template>
    <lightning-card title="Generate Sales Offer">
        <div class="slds-p-around_medium">
            <template lwc:if={isWiring}>
                <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
            </template>
            <template lwc:elseif={isLoading}>
                <lightning-spinner alternative-text="Generating Sales Offer..." size="medium"></lightning-spinner>
            </template>
            <template lwc:elseif={isApproved}>
                <!-- Approved: show read-only summary + payment input -->
                <div class="summary-section slds-m-bottom_medium">
                    <p class="slds-text-heading_small slds-m-bottom_small">Quote Summary (Read-only)</p>
                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <div class="slds-col slds-size_1-of-2 summary-item">
                            <span class="summary-label">Buyer</span>
                            <span class="summary-value">{buyerName}</span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 summary-item">
                            <span class="summary-label">Quote No.</span>
                            <span class="summary-value">{quoteNumber}</span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 summary-item">
                            <span class="summary-label">Unit</span>
                            <span class="summary-value">{unitName}</span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 summary-item">
                            <span class="summary-label">Project</span>
                            <span class="summary-value">{projectName}</span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 summary-item">
                            <span class="summary-label">Chargeable Area (Sq ft)</span>
                            <span class="summary-value">{chargeableArea}</span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 summary-item">
                            <span class="summary-label">Proposed Resale Value</span>
                            <lightning-formatted-number
                                value={proposedValue}
                                format-style="currency"
                                currency-code="INR"
                                currency-display-as="symbol">
                            </lightning-formatted-number>
                        </div>
                        <div class="slds-col slds-size_1-of-2 summary-item">
                            <span class="summary-label">Applicable Charges</span>
                            <lightning-formatted-number
                                value={resaleCharges}
                                format-style="currency"
                                currency-code="INR"
                                currency-display-as="symbol">
                            </lightning-formatted-number>
                        </div>
                        <div class="slds-col slds-size_1-of-2 summary-item grand-total">
                            <span class="summary-label">Grand Total</span>
                            <lightning-formatted-number
                                value={grandTotal}
                                format-style="currency"
                                currency-code="INR"
                                currency-display-as="symbol">
                            </lightning-formatted-number>
                        </div>
                    </div>
                </div>

                <hr/>

                <p class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">Payment Terms</p>
                <template lwc:if={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-theme_error slds-p-around_small slds-m-bottom_medium" role="alert">
                        {errorMessage}
                    </div>
                </template>
                <lightning-combobox
                    label="Payment Type"
                    value={paymentType}
                    options={paymentTypeOptions}
                    required
                    onchange={handlePaymentTypeChange}
                    class="slds-m-bottom_small">
                </lightning-combobox>
                <lightning-input
                    type="date"
                    label="Due Date / Milestone"
                    value={dueDate}
                    onchange={handleDueDateChange}
                    class="slds-m-bottom_small">
                </lightning-input>
                <lightning-textarea
                    label="Remarks"
                    value={remarks}
                    onchange={handleRemarksChange}
                    max-length="500"
                    class="slds-m-bottom_medium">
                </lightning-textarea>
                <div class="slds-grid slds-grid_align-end">
                    <lightning-button label="Cancel" onclick={handleClose} class="slds-m-right_small"></lightning-button>
                    <lightning-button
                        label="Generate Sales Offer"
                        variant="brand"
                        onclick={handleGenerate}>
                    </lightning-button>
                </div>
            </template>
            <template lwc:else>
                <!-- Not approved -->
                <div class="slds-notify slds-notify_alert slds-theme_warning slds-p-around_small" role="alert">
                    <lightning-icon icon-name="utility:warning" size="small" variant="inverse" class="slds-m-right_small"></lightning-icon>
                    {notApprovedMessage}
                </div>
                <div class="slds-m-top_medium">
                    <lightning-button label="Close" onclick={handleClose}></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
