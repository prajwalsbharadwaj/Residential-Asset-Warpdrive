<template>
    <div class="premium-visual-card">
        <div class="custom-card-content">
            <!-- Amount Input -->
            <div class="input-block">
                <label class="input-label">
                    <span class="label-icon"> <!-- Dollar SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-2.21 0-4 1.343-4 3s1.79 3 4 3 4-1.343 4-3-1.79-3-4-3zm0 0V4m0 16v-4"/></svg>
                    </span>
                    Principal Amount (₹)
                </label>
                <input type="number" class="custom-input" placeholder="Enter amount" min="0.01" step="0.01" value={amount} oninput={handleInputChange} name="amount" />
            </div>
            <!-- Interest Rate Input -->
            <div class="input-block">
                <label class="input-label">
                    <span class="label-icon"> <!-- TrendingUp SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 17l6-6 4 4 8-8"/></svg>
                    </span>
                    Interest Rate (%)
                </label>
                <input type="number" class="custom-input" placeholder="Enter interest rate" min="0.01" step="0.01" value={rate} oninput={handleInputChange} name="rate" />
            </div>
            <!-- Time Period Type -->
            <div class="input-block">
                <label class="input-label">
                    <span class="label-icon"> <!-- Clock SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </span>
                    Time Period Type
                </label>
                <div class="custom-radio-group">
                    <label class="custom-radio">
                        <input type="radio" name="periodType" value="Days" checked={isDaysSelected} onchange={handlePeriodTypeChange} />
                        <span class="custom-radio-indicator"></span>
                        Days
                    </label>
                    <label class="custom-radio">
                        <input type="radio" name="periodType" value="Months" checked={isMonthsSelected} onchange={handlePeriodTypeChange} />
                        <span class="custom-radio-indicator"></span>
                        Months
                    </label>
                </div>
            </div>
            <!-- Time Period Input -->
            <template if:true={isMonthsSelected}>
                <div class="input-block">
                    <label class="input-label">Number of Months</label>
                    <input type="number" class="custom-input" placeholder="Enter number of months" min="1" step="1" value={months} oninput={handleInputChange} name="months" />
                    <div class="custom-note">Note: Each month is considered as 30 days</div>
                </div>
            </template>
            <template if:true={isDaysSelected}>
                <div class="input-block">
                    <label class="input-label">Number of Days</label>
                    <input type="number" class="custom-input" placeholder="Enter number of days" min="1" step="1" value={days} oninput={handleInputChange} name="days" />
                </div>
            </template>
            <!-- Action Buttons -->
            <div class="custom-btn-row">
                <button class="custom-btn primary" onclick={handleCalculate} disabled={isCalculateDisabled}>
                    <span class="btn-icon"> <!-- Calculator SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 6h8M8 10h8m-8 4h8m-8 4h8M5 4h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>
                    </span>
                    Calculate Interest
                </button>
                <button class="custom-btn outline" onclick={handleReset}>Reset</button>
            </div>
            <!-- Result Display -->
            <template if:true={showResult}>
                <div class="custom-result animate-fade-in">
                    <span class="custom-badge">Interest Calculated</span>
                    <div class="custom-result-label">TOTAL INTEREST PAYABLE</div>
                    <div class="custom-result-value">₹
                        <lightning-formatted-number value={interest} maximum-fraction-digits="2" minimum-fraction-digits="2"></lightning-formatted-number>
                    </div>
                    <div class="custom-result-summary">
                        Principal: ₹{formattedPrincipal} • Rate: {rate}% • Duration Period: {resultTimeSummary}
                    </div>
                </div>
            </template>
        </div>
    </div>
</template>
