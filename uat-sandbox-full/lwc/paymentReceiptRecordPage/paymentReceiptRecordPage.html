<template>
<lightning-card>
    <div class="slds-p-around_medium">

        <!-- Header -->
        <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center slds-m-bottom_medium">
            <lightning-icon icon-name="utility:money" size="medium" variant="success" class="slds-m-right_small"></lightning-icon>
            <h1 class="header-title">New Payment Receipt</h1>
        </div>

        <div class="header-line"></div>

        <div class="slds-text-align_right slds-m-bottom_medium required-note">
            <small><span class="required-star">*</span> = Required Information</small>
        </div>
        
        <template if:true={formReady}>
            <!-- Spinner -->
        <template if:true={loading}>
            <div class="slds-spinner_container slds-is-relative slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
            </div>
        </template>
            <lightning-record-edit-form 
                object-api-name="Payment_Receipt__c" 
                onsuccess={handleSuccess}
                onsubmit={handleSubmit}
                onerror={handleError}>

                <lightning-messages onerror={handleError}></lightning-messages>

                <!-- Information Section -->
                <div class="slds-box slds-m-bottom_medium section-box">
                    <h3 class="section-header">Information</h3>

                    <!-- Row 1: Lookups -->
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Account__c" value={accountId} disabled></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Booking_Payment_Schedule__c" value={bookingPaymentScheduleId} disabled></lightning-input-field>
                        </div>
                    </div>

                    <!-- Row 2: Demand and Company Bank Account -->
                    <div class="slds-grid slds-gutters slds-m-top_small">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Demand__c" value={recordId} disabled></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Company_Bank_Account__c" required={requiredCompanyBankAccount}></lightning-input-field>
                        </div>
                    </div>

                    <!-- Row 3: Customer Bank Name + Customer Account Number -->
                    <div class="slds-grid slds-gutters slds-m-top_small">
                            <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Customer_Bank_Name__c" disabled={disableCustomerBankName}></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="CustomerAccountNumber__c"></lightning-input-field>
                        </div>
                    </div>

                    <!-- Row 4: Date Of Payment + Mode Of Payment -->
                    <div class="slds-grid slds-gutters slds-m-top_small">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Date_Of_Payment__c"></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Mode_Of_Payment__c" onchange={handlePaymentModeChange}></lightning-input-field>
                        </div>
                    </div>

                    <!-- Row 5: Conditional Fields -->
                    <div class="slds-grid slds-gutters slds-m-top_small">
                        <template if:true={showChequeNumber}>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input-field field-name="ChequeNumber__c" required></lightning-input-field>
                            </div>
                        </template>

                        <template if:true={showCertificateAndChallan}>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input-field field-name="Certificate_Number__c" ></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="Challan_Number__c"></lightning-input-field>
                            </div>
                        </template>

                        <template if:true={showTransactionReference}>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input-field field-name="Transaction_Reference__c" required></lightning-input-field>
                            </div>
                        </template>
                    </div>

                    <!-- Row 5:Instrument Date-->
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Instrument_Date__c" required></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2"></div>
                    </div>

                </div>
                <!-- Information Section End -->

                <!-- Payment Details Section -->
                <div class="slds-box slds-m-bottom_medium section-box">
                    <h3 class="section-header">Payment Details</h3>

                    <div class="slds-grid slds-gutters slds-m-bottom_small">
                    <!-- Outstanding Principal -->
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input label="Outstanding Principal" read-only variant="label-inline" value={fixedOutstandingPrincipal} type="number"></lightning-input>
                    </div>
                    <!-- Remaining Principal -->
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input label="Remaining Principal" read-only variant="label-inline" value={remainingPrincipalValue} type="number"></lightning-input>
                    </div>
                    </div>

                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Amount_Paid__c" onchange={handleFieldChange}></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Principal_Applied__c" value={principalFloat} onchange={handleFieldChange}></lightning-input-field>
                        </div>
                    </div>

                    <div class="slds-grid slds-gutters slds-m-top_small">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Interest_Applied__c" onchange={handleFieldChange} ></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Tax_on_Interest__c" value={taxOnInterest} disabled onchange={handleFieldChange}></lightning-input-field>
                        </div>
                    </div>

                    <div class="slds-grid slds-gutters slds-m-top_small">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input-field field-name="Excess_Payment__c" value={excessPayment} disabled></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2"></div>

                    </div>
                </div>
                <!-- Payment Details Section End -->

                <!-- Footer -->
                <footer class="slds-card__footer slds-grid slds-grid_align-end slds-m-top_medium">
                    <div class="slds-m-top_medium slds-align_absolute-center">
                        <lightning-button variant="brand" type="submit" label="Save" disabled={isSubmitting}></lightning-button>
                        <lightning-button variant="neutral" label="Cancel" onclick={handleCancel} class="slds-m-left_small"></lightning-button>
                        <lightning-messages></lightning-messages>
                    </div>
                </footer>
            </lightning-record-edit-form>
        </template>

        <template if:false={formReady}>
            <div class="slds-text-align_center slds-p-around_medium">
                Loading Payment Receipt form...
            </div>
        </template>

    </div>
</lightning-card>
</template>
