<template>
    <div class={formElementClasses} style="padding-bottom: 0.5rem;">
        <label class="slds-form-element__label" for="combobox-id-2" id="combobox-label-id-130">
            <abbr if:true={required} class="slds-required" title="required">* </abbr>
            {label}
        </label>

        <div class="slds-form-element__control">
            <div class="slds-combobox_container" style="position: relative;">
                <div class={classes} role="combobox" aria-haspopup="listbox" aria-expanded="true" aria-owns="listbox-id-4">
                    <!-- Input with left icon -->
                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right" role="none">
                        <lightning-icon
                            size="x-small"
                            icon-name="utility:search"
                            class="slds-icon slds-input__icon slds-input__icon_left slds-icon-text-default">
                        </lightning-icon>

                        <input
                            required={required}
                            type="text"
                            id="text-input-id-1"
                            class={inputClasses}
                            value={displayText}
                            onkeyup={handleChange}
                            onfocus={handleFocus}
                            onblur={handleBlur}
                            onkeydown={handleKeyDown}
                            oninput={handleInput}
                            aria-invalid={isInvalid}
                            aria-describedby="form-error-01"
                            autocomplete="off" />
                    </div>

                    <!-- Dropdown list -->
                    <div
                        if:true={tempOptions.length}
                        id="listbox-id-4"
                        class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                        style="position: absolute; z-index: 9999; width: 100%;"
                        role="listbox"
                        onmousedown={handleDropdownMouseDown}
                        onmouseup={handleDropdownMouseUp}
                        onmouseleave={handleDropdownMouseLeave}>

                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                            <template for:each={tempOptions} for:item="option">
                                <li key={option.value} role="presentation" class="slds-listbox__item">
                                    <div
                                        onclick={handleSelect}
                                        data-value={option.value}
                                        class={option.classes}
                                        role="option"
                                        data-focused={option.focused}>
                                        
                                        <span class="slds-media__body">
                                            <span class="slds-truncate" title={option.label}>
                                                {option.label}
                                            </span>
                                        </span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="slds-form-element__help" if:true={isInvalid} id="form-error-01">
            {messageWhenInvalid}
        </div>
    </div>
</template>
