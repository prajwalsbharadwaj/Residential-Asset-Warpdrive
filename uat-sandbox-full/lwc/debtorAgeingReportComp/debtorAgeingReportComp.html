<template>
    <lightning-card title="🏢 Debtor Ageing Report" class="dashboard-card">
        <div class="filter-bar">
            <lightning-combobox
                    name="tower"
                    label="Select Tower"
                    value={selectedTower}
                    placeholder="-- Select Tower --"
                    options={towerOptions}
                    onchange={handleTowerChange}>
                </lightning-combobox>

                <lightning-button 
                    variant="brand"
                    label="Search"
                    onclick={fetchBookings}
                    class="search-btn">
                </lightning-button>
        </div>

        <template if:true={loading}>
            <div class="spinner-container">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={showRecords}>
                <div class="table-container">
                    <lightning-datatable
                        key-field="Id"
                        data={bookings}
                        columns={columns}
                        hide-checkbox-column
                        resize-column-disabled>
                    </lightning-datatable>
                </div>

            <div class="pagination">
                <lightning-button label="Previous" onclick={handlePrevious} disabled={isPrevDisabled} variant="brand"></lightning-button>
                <span>Page {pageNumber} of {totalPages}</span>
                <lightning-button label="Next" onclick={handleNext} disabled={isNextDisabled} variant="brand"></lightning-button>
                <lightning-button label="Close" onclick={handleClose} variant="destructive"></lightning-button>
            </div>
        </template>

        <template if:false={bookings.length}>
            <div class="no-data">{displayMessage}</div>
        </template>
        
    </lightning-card>
</template>
